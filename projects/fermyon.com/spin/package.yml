distributable:
  url: https://github.com/fermyon/spin/archive/refs/tags/{{ version.tag }}.tar.gz
  strip-components: 1

provides:
  - bin/spin

versions:
  github: fermyon/spin

companions:
  rust-lang.org: '*'
  rust-lang.org/cargo: '*'
  git-scm.org: '*'

build:
  dependencies:
    rust-lang.org/rustup: '*' # required for wasm targets
    linux:
      llvm.org: '*' # line 30: /home/builder/actions-runner/_work/pantry/pantry/homes/fermyon.com__spin-2.7.0/toolchain/cc: No such file or directory
  script:
    # https://developer.fermyon.com/spin/v2/contributing-spin#making-code-contributions-to-spin
    - run:
        - ln -sf {{deps.rust-lang.org/rustup.prefix}}/bin/rustup .
        - rustup default $RUSTUP_TOOLCHAIN
        - rustup target add wasm32-wasi || true # depends on version
        - rustup target add wasm32-wasip1 wasm32-wasip2 wasm32-unknown-unknown
        - ln -sf $HOME/.rustup/toolchains/*/bin/* .
      working-directory: $HOME/.cargo/bin

    # rust 1.98.0 switched darwin's rust-lld/rust-objcopy from a statically linked
    # LLVM to `@rpath/libLLVM.dylib`, but their only rpath is `@loader_path/../lib`
    # -- ie lib/rustlib/<target>/lib -- and no component ships the dylib there; it
    # lives at <toolchain>/lib/libLLVM.dylib. so every wasm32 link, which is what
    # rust-lld is *for*, dies with `Library not loaded: @rpath/libLLVM.dylib`.
    # linux is unaffected: there RUNPATH is `$ORIGIN/../../../:$ORIGIN/../lib`,
    # ie it keeps the entry darwin lost. cf. rust-lang/rust#53813 and #76921.
    - run: |
        for bin in $HOME/.rustup/toolchains/*/lib/rustlib/*/bin; do
          test -f "$bin/rust-lld" || continue
          test -f "$bin/../../../libLLVM.dylib" || continue
          mkdir -p "$bin/../lib"
          ln -sf ../../../libLLVM.dylib "$bin/../lib/libLLVM.dylib"
        done
      if: darwin

    - cargo install --locked --path . --root {{prefix}}
  env:
    PATH: $HOME/.cargo/bin:$PATH
    linux:
      AR: llvm-ar
    linux/x86-64:
      RUSTUP_TOOLCHAIN: stable-x86_64-unknown-linux-gnu
    linux/aarch64:
      RUSTUP_TOOLCHAIN: stable-aarch64-unknown-linux-gnu
    darwin/x86-64:
      RUSTUP_TOOLCHAIN: stable-x86_64-apple-darwin
    darwin/aarch64:
      RUSTUP_TOOLCHAIN: stable-aarch64-apple-darwin

test:
  dependencies:
    rust-lang.org/rustup: '*' # required for wasm targets
  script:
    - spin templates install --git https://github.com/fermyon/spin
    - spin new --accept-defaults -t http-rust hello-rust

    - run:
        - ln -sf {{deps.rust-lang.org/rustup.prefix}}/bin/rustup .
        - rustup default stable
        # wasi name/version depends on rust version
        - rustup target add wasm32-wasip1 wasm32-wasip2 wasm32-unknown-unknown
        - ln -sf $HOME/.rustup/toolchains/*/bin/* .
      working-directory: $HOME/.cargo/bin

    # rust 1.98.0 switched darwin's rust-lld/rust-objcopy from a statically linked
    # LLVM to `@rpath/libLLVM.dylib`, but their only rpath is `@loader_path/../lib`
    # -- ie lib/rustlib/<target>/lib -- and no component ships the dylib there; it
    # lives at <toolchain>/lib/libLLVM.dylib. so every wasm32 link, which is what
    # rust-lld is *for*, dies with `Library not loaded: @rpath/libLLVM.dylib`.
    # linux is unaffected: there RUNPATH is `$ORIGIN/../../../:$ORIGIN/../lib`,
    # ie it keeps the entry darwin lost. cf. rust-lang/rust#53813 and #76921.
    - run: |
        for bin in $HOME/.rustup/toolchains/*/lib/rustlib/*/bin; do
          test -f "$bin/rust-lld" || continue
          test -f "$bin/../../../libLLVM.dylib" || continue
          mkdir -p "$bin/../lib"
          ln -sf ../../../libLLVM.dylib "$bin/../lib/libLLVM.dylib"
        done
      if: darwin

    - run: spin build
      working-directory: hello-rust
  env:
    PATH: $HOME/.cargo/bin:$PATH
