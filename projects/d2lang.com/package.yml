distributable:
  url: https://github.com/terrastruct/d2/archive/refs/tags/{{version.tag}}.tar.gz
  strip-components: 1

versions:
  github: terrastruct/d2

provides:
  - bin/d2

build:
  dependencies:
    go.dev: ^1.20
  script:
    - go mod download
    - go build -v -trimpath -ldflags="$GO_LDFLAGS" -o {{prefix}}/bin/d2 .
  env:
    GO111MODULE: on
    CGO_ENABLED: 0
    GO_LDFLAGS:
      - -s
      - -w
      # 0.8.0 moved the module from oss.terrastruct.com/d2 to github.com/d2lang/d2.
      # the linker ignores an -X naming a symbol that isn't there, so the stale
      # path cost nothing at build time -- `d2 version` just kept printing
      # lib/version's hardcoded "v0.8.1-HEAD" default. both ride along so either
      # side of the rename gets stamped.
      - -X oss.terrastruct.com/d2/lib/version.Version={{version}}
      - -X github.com/d2lang/d2/lib/version.Version={{version}}
    linux:
      # or segmentation fault
      # fix found here https://github.com/docker-library/golang/issues/402#issuecomment-982204575
      GO_LDFLAGS:
      - -buildmode=pie

test: test "$(d2 version)" = "{{version}}"
