distributable:
  url: https://github.com/expo/eas-cli/archive/refs/tags/v{{version.raw}}.tar.gz
  strip-components: 1

display-name: eas

versions:
  github: expo/eas-cli

dependencies:
  nodejs.org: ^18.18 || >=20

build:
  dependencies:
    python.org: ~3.10
    yarnpkg.com: ">=4.12" # per package.json, v18.0.3
    github.com/mikefarah/yq: ">=4" # safe-edit json version field
    linux:
      gnu.org/gcc: "*"
  script:
    - mkdir -p "{{prefix}}"

    # missed version bump
    - run: yq -i '.version = "{{version}}"' package.json
      working-directory: packages/eas-cli

    # bufferutil / utf-8-validate are optional native addons of `ws` (pure-JS
    # fallback otherwise). They have no aarch64 prebuild, so yarn compiles them,
    # and pkgx's bare gcc has no libc headers in node-gyp's subprocess:
    # "fatal error: assert.h: No such file or directory". Suppress the build --
    # root manifest, which is the only place yarn honours dependenciesMeta.built.
    - yq -i '.dependenciesMeta."bufferutil".built = false | .dependenciesMeta."utf-8-validate".built = false' package.json

    - yarn install

    # `build-ci` not present in v6
    - run: BUILD_CMD="build-ci"
      if: <6
    - run: BUILD_CMD="build"
      if: ">=6"

    - run: yarn $BUILD_CMD
      if: <18.0.1
      working-directory: packages/eas-json/

    - yarn $BUILD_CMD
    - cp -r * {{prefix}}

    - run:
        - ln -s ../packages/eas-cli/bin/run bin/eas
      working-directory: ${{prefix}}

provides:
  - bin/eas

test:
  - eas
  - eas --help
  - eas --version
  - eas --version | grep "{{version}}"
  - eas autocomplete zsh
