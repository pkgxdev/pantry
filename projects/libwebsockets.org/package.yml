distributable:
  url: https://github.com/warmcat/libwebsockets/archive/v{{version}}.tar.gz
  strip-components: 1

versions:
  github: warmcat/libwebsockets/tags

dependencies:
  libuv.org: 1
  libevent.org: 2

build:
  dependencies:
    cmake.org: 3
  working-directory: build
  script:
    # v5.0.0's plugins cannot be configured in-tree. Every plugin gates itself
    # on require_lws_config, whose in-tree branch is only taken for minimal
    # examples; otherwise it falls through to a CHECK_C_SOURCE_COMPILES that
    # includes <libwebsockets.h>. During our own configure nothing is installed
    # yet, so that probe cannot compile, every role reads as absent, and
    # protocol_client_loopback_test aborts with "requires LWS_ROLE_WS". The
    # plugins are dlopened protocol handlers for lwsws; our one dependent, ttyd,
    # compiles its own protocol in and does not load them.
    - run: ARGS="$ARGS -DLWS_WITH_PLUGINS=OFF"
      if: ">=5"

    - cmake .. -DCMAKE_INSTALL_PREFIX="{{prefix}}" $ARGS
    - make --jobs {{ hw.concurrency }} install

    - run: sed -E -i -f $PROP LibwebsocketsTargets.cmake libwebsockets-config.cmake
      prop: |
        s:{{pkgx.prefix}}:\$\{_IMPORT_PREFIX\}/../..:g
        /^  INTERFACE_INCLUDE_DIRECTORIES/ s|/v([0-9]+)(\.[0-9]+)*[a-z]?/include|/v\1/include|g
        /^  INTERFACE_LINK_LIBRARIES/ s|/v([0-9]+)(\.[0-9]+)*[a-z]?/lib|/v\1/lib|g
        /^set\(LIBWEBSOCKETS_INCLUDE_DIRS/ s|/v([0-9]+)(\.[0-9]+)*[a-z]?/include|/v\1/include|g
      working-directory: ${{prefix}}/lib/cmake/libwebsockets
  env:
    ARGS:
      - -DLWS_IPV6=ON
      - -DLWS_WITH_HTTP2=ON
      # v5.0.0 flipped HTTP/3 on by default (LWS_QUIC_DEFAULT is ON unless
      # LWS_WITH_UDP is explicitly off). HTTP/3 plus SSL with no alternative TLS
      # backend then *force*-enables LWS_WITH_GNUTLS, which fails configure
      # because gnutls is not a dependency here. It cannot simply be added
      # either: lws needs SSL_set_quic_method for QUIC, which stock OpenSSL does
      # not provide, so upstream reaches for GnuTLS instead. Taking gnutls would
      # switch the TLS backend out from under our only dependent, ttyd. Leaving
      # HTTP/3 off keeps OpenSSL and matches what every prior version shipped.
      - -DLWS_WITH_HTTP3=OFF
      - -DLWS_WITH_EVLIB_PLUGINS=OFF
      - -DLWS_WITH_LIBEVENT=ON
      - -DLWS_WITH_LIBUV=ON
      - -DLWS_WITH_PLUGINS=ON
      - -DLWS_WITHOUT_TESTAPPS=ON
      - -DLWS_UNIX_SOCK=ON

test:
  - run: cc $FIXTURE -lwebsockets
    fixture:
      extname: c
      contents: |
          #include <openssl/ssl.h>
          #include <libwebsockets.h>

          int main() {
            struct lws_context_creation_info info;
            memset(&info, 0, sizeof(info));
            struct lws_context *context;
            context = lws_create_context(&info);
            lws_context_destroy(context);
            return 0;
          }

  - ./a.out
