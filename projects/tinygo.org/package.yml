distributable:
  url: git+https://github.com/tinygo-org/tinygo.git
  ref: ${{version.tag}}

versions:
  github: tinygo-org/tinygo

dependencies:
  go.dev: '*'
  github.com/WebAssembly/binaryen: ^133

companions:
  llvm.org: '*'

build:
  dependencies:
    go.dev: ^1.18
    git-scm.org: 2
    cmake.org: 3
    ninja-build.org: 1
    nodejs.org: '*'
    python.org: '>=3.6'
  script:
    - git submodule update --init --recursive
    - make llvm-source
    - make llvm-build
    - make
    - make release
    - mkdir -p '{{prefix}}'
    - tar -zxf build/release.tar.gz -C "{{prefix}}" --strip-components=1
  env:
    linux:
      CC: clang
      CXX: clang++
    # Use our binaryen (tinygo's default on darwin). Its vendored copy fails
    # on linux: llvm.org's headers on CPATH shadow its vendored LLVM, and the
    # builder's libstdc++-8 lacks the C++20 library it needs. tinygo finds
    # wasm-opt on PATH; the submodule pins version 133.
    USE_SYSTEM_BINARYEN: 1

provides:
  - bin/tinygo

test:
  - run: mv $FIXTURE test.go
    fixture: |
      package main
      import "fmt"
      func main() {
        fmt.Println("Hello World")
      }
  - test "$(tinygo run test.go)" = "Hello World"
  - tinygo build -o my-artifact test.go
  - test "$(./my-artifact)" = "Hello World"
