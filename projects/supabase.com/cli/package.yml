distributable:
  url: https://github.com/supabase/cli/archive/refs/tags/{{version.tag}}.tar.gz
  strip-components: 1

versions:
  github: supabase/cli

build:
  dependencies:
    go.dev: ^1.18
    bun.sh: ~1.4
    pnpm.io: '*'
  script:
    - run: cd apps/cli-go
      if: ">=2.99<3"
    - run:
        - go mod download
        - go build -v -ldflags="$GO_LDFLAGS"
        - mkdir -p "{{ prefix }}"/bin
        - mv cli "{{ prefix }}"/bin/supabase
      if: "<3"
    # v3 rewrote the CLI in TypeScript; upstream ships a bun-compiled binary
    - run:
        - pnpm install --frozen-lockfile
        - cd apps/cli
        - pnpm pkg set version={{version}}
        - bun scripts/build-binary.ts
        - install -D dist/supabase "{{ prefix }}"/bin/supabase
      if: ">=3"
  # patchelf breaks bun-compiled binaries (segfault); cf. bun.sh, tailwindcss.com
  skip: fix-patchelf
  env:
    GO111MODULE: on
    GO_LDFLAGS: [-s, -w, "-X=main.Version={{version}}"]
    linux:
      # or segmentation fault
      # fix found here https://github.com/docker-library/golang/issues/402#issuecomment-982204575
      GO_LDFLAGS:
        - -buildmode=pie

provides:
  - bin/supabase

test:
  - supabase --help
  - test "$(supabase --version)" = "{{version}}"
