distributable:
  url: https://github.com/tesseract-ocr/tesseract/archive/refs/tags/{{version}}.tar.gz
  strip-components: 1

versions:
  github: tesseract-ocr/tesseract

dependencies:
  cairographics.org: 1
  unicode.org: 71
  leptonica.org: '*'
  libarchive.org: '*'
  gnome.org/pango: 1

build:
  dependencies:
    gnu.org/autoconf: '*'
    gnu.org/automake: '*'
    gnu.org/libtool: '*'
    gnu.org/wget: '*'
  script:
    - ./autogen.sh
    - ./configure $ARGS
    - make --jobs {{ hw.concurrency }}
    - make install

    # install trained datafiles and move to share/tessdata
    - run:
        - wget https://github.com/tesseract-ocr/tessdata/blob/main/eng.traineddata?raw=true -O eng.traineddata
        - wget https://github.com/tesseract-ocr/tessdata/blob/main/osd.traineddata?raw=true -O osd.traineddata
      working-directory: '{{prefix}}/share/tessdata/'

    # the data path is baked in at configure time, so a relocatable shim sets
    # TESSDATA_PREFIX unless a tessdata package (or the user) already has
    - run: |
        mkdir -p "{{prefix}}/libexec"
        mv "{{prefix}}/bin/tesseract" "{{prefix}}/libexec/tesseract"
        install -m755 $PROP "{{prefix}}/bin/tesseract"
      prop: |
        #!/bin/sh
        d="$(cd "$(dirname "$0")/.." && pwd)"
        : "${TESSDATA_PREFIX:=$d/share/tessdata}"
        export TESSDATA_PREFIX
        exec "$d/libexec/tesseract" "$@"
  env:
    ARGS:
      - --prefix="{{prefix}}"
      - --disable-dependency-tracking
      - --datarootdir="{{prefix}}"/share
    linux:
      # ld.lld: error: undefined symbol: std::filesystem::__cxx11::path::_M_std::filesystem::__cxx11::recursive_directory_iterator::recursive_directory_iterator(std::filesystem::__cxx11::path const&, std::filesystem::directory_options, std::error_code*)
      LDFLAGS: '$LDFLAGS -lstdc++fs'
      # tesseract.cpp unconditionally enables FP traps (feenableexcept) on glibc;
      # clang's vectorized divides in correct_row_xheight then raise SIGFPE on
      # native x86-64 (#14768). Without the trap a stray divide just yields inf.
      ARGS:
        - ac_cv_func_feenableexcept=no

provides:
  - bin/tesseract

test:
  dependencies:
    gnu.org/wget: '*'
  script:
    - wget https://raw.githubusercontent.com/tesseract-ocr/test/6dd816cdaf3e76153271daf773e562e24c928bf5/testing/eurotext.tif
    - tesseract eurotext.tif stdout -l eng
