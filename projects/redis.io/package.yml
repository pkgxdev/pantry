distributable:
  url: https://download.redis.io/releases/redis-{{ version }}.tar.gz
  strip-components: 1

versions:
  github: redis/redis

provides:
  - bin/redis-server
  - bin/redis-cli
  - bin/redis-benchmark

dependencies:
  openssl.org: ^1

build:
  script:
    # 8.10 added `deploy: PREFIX ?= /usr/local` to the top level Makefile. a
    # target-specific assignment makes GNU make drop PREFIX from the environment
    # of *every* recipe, so the `$(MAKE) -C src install` recursion no longer sees
    # ours and src/Makefile falls back to its own /usr/local default. passing it
    # on the command line survives the recursion via MAKEOVERRIDES.
    # TODO: configure default redis.conf if necessary
    - make install PREFIX="{{prefix}}"
  env:
    BUILD_TLS: yes
    linux/x86-64:
      CFLAGS: -fPIC
      CXXFLAGS: -fPIC
      LDFLAGS: -pie
    darwin:
      # wut? - ld: unknown option: -Wl,-rpath,/opt
      LDFLAGS: -rpath {{pkgx.prefix}}

test:
  - redis-server --daemonize yes
  - redis-cli --raw SET key123 value123

  - test "$(redis-cli --raw GET key123)" = "value123"

  - redis-cli shutdown
