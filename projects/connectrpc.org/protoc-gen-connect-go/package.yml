distributable:
  url: https://github.com/connectrpc/connect-go/archive/refs/tags/{{version.tag}}.tar.gz
  strip-components: 1

versions:
  github: connectrpc/connect-go

provides:
  - bin/protoc-gen-connect-go

build:
  script:
    - go mod download
    - go build -v -trimpath -ldflags="$GO_LDFLAGS" -o $BUILDLOC ./cmd/protoc-gen-connect-go
  dependencies:
    go.dev: ^1.20
  env:
    GO111MODULE: on
    CGO_ENABLED: 0
    BUILDLOC: '{{prefix}}/bin/protoc-gen-connect-go'
    GO_LDFLAGS:
      - -s
      - -w
      - -X main.version={{version}}
      - -X main.debugMode=false
    linux:
      # or segmentation fault
      # fix found here https://github.com/docker-library/golang/issues/402#issuecomment-982204575
      GO_LDFLAGS:
      - -buildmode=pie

test:
  - protoc-gen-connect-go --version | tee out
  - grep {{version}} out
