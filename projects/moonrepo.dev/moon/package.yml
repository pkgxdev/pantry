distributable:
  url: https://github.com/moonrepo/moon/archive/refs/tags/{{ version.tag }}.tar.gz
  strip-components: 1

provides:
  - bin/moon

versions:
  github: moonrepo/moon

build:
  dependencies:
    rust-lang.org/rustup: "*"
    protobuf.dev: "*" # since 2.2.0
    freedesktop.org/pkg-config: "*"
  script:
    # follow upstream's pinned channel; the newest rust breaks its locked deps
    - run: ln -sf {{deps.rust-lang.org/rustup.prefix}}/bin/rustup rustup
      working-directory: $HOME/.cargo/bin
    - run: rustup default "$(sed -n 's/^channel = "\(.*\)".*/\1/p' $SRCROOT/rust-toolchain.toml)"
    - run: ln -sf $HOME/.rustup/toolchains/*/bin/* .
      working-directory: $HOME/.cargo/bin

    - if test -d crates/cli; then
    - cargo install --locked --path crates/cli --root {{prefix}}
    - elif test -d legacy/cli; then
    - cargo install --locked --path legacy/cli --root {{prefix}}
    - else
    - cargo install --locked --path . --root {{prefix}}
    - fi
  env:
    PATH: $HOME/.cargo/bin:$PATH

test:
  - moon init --minimal --yes
  - test -f ".moon/workspace.yml"
