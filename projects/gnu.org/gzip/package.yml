distributable:
  url: https://ftp.gnu.org/gnu/gzip/gzip-{{version.raw}}.tar.xz
  strip-components: 1

versions:
  url: https://ftp.gnu.org/gnu/gzip/
  match: /gzip-\d+\.\d+(\.\d+)?\.tar\.xz/
  strip:
    - /^gzip-/
    - /\.tar\.xz$/

build:
  script:
    # zless/zmore are optional wrappers; preseed so they install even when
    # the builder does not have less(1) or more(1) on PATH.
    - ./configure $ARGS ac_cv_prog_LESS=less ac_cv_prog_MORE=more
    - make --jobs {{ hw.concurrency }} install CFLAGS="$MAKE_CFLAGS"
  env:
    ARGS:
      - --prefix="{{prefix}}"
      - --disable-dependency-tracking
    # same as autoconf's default CFLAGS, passed at make time only. On
    # linux/aarch64, gzip.h's `#define head` collides with `head` members in
    # asm/sigcontext.h (pulled in by signal.h after gzip.h), so include it first.
    # Not via configure: it would leak into configure's preprocessor probes.
    MAKE_CFLAGS:
      - -g
      - -O2
    linux/aarch64:
      MAKE_CFLAGS:
        - -include asm/sigcontext.h

provides:
  - bin/gunzip
  - bin/gzexe
  - bin/gzip
  - bin/uncompress
  - bin/zcat
  - bin/zcmp
  - bin/zdiff
  - bin/zegrep
  - bin/zfgrep
  - bin/zforce
  - bin/zgrep
  - bin/zless
  - bin/zmore
  - bin/znew

test:
  env:
    INPUT: tea.xyz.test-string
  script:
    - gzip --version | grep {{version.raw}}
    - test "$(printf '%s' "$INPUT" | gzip -c | gunzip -c)" = "$INPUT"
    - test "$(printf '%s' "$INPUT" | gzip -c | zcat)" = "$INPUT"
