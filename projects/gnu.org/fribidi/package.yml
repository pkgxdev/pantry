distributable:
  url: https://github.com/fribidi/fribidi/releases/download/v{{ version }}/fribidi-{{ version }}.tar.xz
  strip-components: 1

versions:
  github: fribidi/fribidi
  strip: /^FriBidi Version /

build:
  - ./configure --prefix={{prefix}} --disable-debug
  # the man page is regenerated with help2man; we don't ship man pages, so
  # take it out of the build instead of depending on help2man
  - make --jobs={{ hw.concurrency }} dist_man_MANS= install

test:
  - run: out="$(fribidi --charset=CapRTL --clean --nobreak $FIXTURE)"
    fixture: a _lsimple _RteST_o th_oat
  - test "$out" = "a simple TSet that"

provides:
  - bin/fribidi
