distributable:
  - url: https://ftp.gnu.org/gnu/gcc/gcc-{{version.raw}}/gcc-{{ version.raw }}.tar.xz
    strip-components: 1
  # Pre-5.5 gcc only published .tar.bz2 / .tar.gz; needed for cascade to
  # glibc 2.17 (which empirically wants gcc ~7.5 to build cleanly).
  - url: https://ftp.gnu.org/gnu/gcc/gcc-{{version.raw}}/gcc-{{ version.raw }}.tar.gz
    strip-components: 1
  - url: https://ftp.gnu.org/gnu/gcc/gcc-{{version.raw}}/gcc-{{ version.raw }}.tar.bz2
    strip-components: 1

versions:
  github: gcc-mirror/gcc/tags
  strip: /^releases\/gcc-/

# NOTE: pkgx today ships 10.5 – 16.1. Older gcc (5–9) is required to
# build glibc 2.17 – 2.26 (HPC / manylinux2014 / RHEL 7-8) because
# glibc’s rtld sources emit relocation forms newer binutils ld reject
# in shared/PIE mode, and modern gcc’s default code-gen choices (PIC
# semantics, code-model defaults) conflict with old glibc build
# assumptions. The empirically-validated cascade (linux/aarch64 and
# linux/x86-64) is documented in projects/gnu.org/glibc/README.md.

dependencies:
  gnu.org/binutils: "*" # linker needs `as`
  gnu.org/gmp: ">=4.2"
  gnu.org/mpfr: ">=2.4.0"
  gnu.org/mpc: ">=0.8.0"
  zlib.net: ^1.3
  darwin/x86-64: # since 15.1.0
    libisl.sourceforge.io: ^0

build:
  dependencies:
    linux:
      gnu.org/gcc: 14
    gnu.org/make: "*"
    perl.org: "^5.6.1"
    gnu.org/patch: "*"
    curl.se: "*"
    github.com/westes/flex: "*"
  working-directory: build
  script:
    # Applying ians patches on x86-64 too, since he sometimes gets fixes in faster, like:
    # https://github.com/orgs/Homebrew/discussions/5216
    # If we have a patch, apply it
    - run:
        - if test -n "$PATCH{{version.major}}{{version.minor}}"; then
        - curl "$PATCH{{version.major}}{{version.minor}}" | patch -p1
        - fi
      if: darwin
      working-directory: ..

    # if there's no diff yet, unpack iains' source over ours
    - run:
        - if test -n "$BRANCH{{version.major}}{{version.minor}}"; then
        - curl -L "$BRANCH{{version.major}}{{version.minor}}" | tar xz --strip-components=1
        - fi
      if: darwin/aarch64
      working-directory: ..

    - run:
        - if test "{{hw.platform}}/{{hw.arch}}" = "darwin/x86-64"; then
        # Apply CFI directive fix for x86-64 Darwin (LLVM assembler compatibility)
        - patch -p1 < props/disable-cfi-x86-64-darwin.patch
        # Disable MS ABI stubs on Darwin - not needed and causes CFI/LLVM assembler issues
        - sed -i 's/ i386\/t-msabi//g' libgcc/config.host
        # Remove old frame registration symbols from darwin-unwind.ver (GCC 15+ doesn't provide these)
        - patch -p1 < props/remove-old-frame-symbols-darwin.patch
        - fi
      if: "^14.2 || >=15.2"
      working-directory: ..

    # The spaces mess things up in the env key
    - ARGS=($ARGS --with-pkgversion="pkgx GCC {{version}}")

    # On Linux, we need to statically link libstdc++ and libgcc
    - run: export ARGS=("${ARGS[@]}" --with-boot-ldflags="-static-libstdc++ -static-libgcc $LDFLAGS")
      if: linux

    # PIE-by-default linux flags were added across gcc versions:
    #   --enable-default-pie : gcc 6+
    #   --enable-pie-tools   : gcc 9+
    #   --enable-host-pie    : gcc 13+
    # Add each only when the gcc version supports it, so older gcc
    # (used in the HPC cascade to build glibc 2.17/2.24) doesn't fail
    # configure with "unrecognized option".
    - run: |
        if [ {{version.major}} -ge 6 ];  then ARGS=("${ARGS[@]}" --enable-default-pie); fi
        if [ {{version.major}} -ge 9 ];  then ARGS=("${ARGS[@]}" --enable-pie-tools); fi
        if [ {{version.major}} -ge 13 ]; then ARGS=("${ARGS[@]}" --enable-host-pie); fi
        export ARGS
      if: linux

    # For old gcc (< 10) used in the HPC bootstrap cascade, also disable
    # LTO and the linker plugin. Both load shared objects that mix libc
    # versions across host ld-linux and the bottle's libc at link time.
    # Modern gcc bottles (>= 10) keep LTO enabled.
    - run: ARGS=("${ARGS[@]}" --disable-lto --disable-plugin); export ARGS
      if: "<10"

    # Bake mpc / mpfr / gmp / zlib RUNPATH into all linked binaries so
    # the built gcc + cc1 / cc1plus run without requiring
    # LD_LIBRARY_PATH at runtime.
    - run: |
        DEPRP="{{deps.gnu.org/mpc.prefix}}/lib:{{deps.gnu.org/mpfr.prefix}}/lib:{{deps.gnu.org/gmp.prefix}}/lib:{{deps.zlib.net.prefix}}/lib"
        export LDFLAGS="$LDFLAGS -Wl,-rpath,$DEPRP -Wl,-rpath-link,$DEPRP"
      if: linux

    # needed to get the LDFLAGS to libgfortran on darwin
    # for -headerpad_max_install_names
    - run: export LDFLAGS_FOR_TARGET="$LDFLAGS"
      if: darwin

    - ../configure "${ARGS[@]}"
    - make --jobs {{ hw.concurrency }}
    - make install

    # For old-gcc bottles intended to participate in the HPC cascade
    # (gcc 5–9 used to build glibc 2.17–2.26), strip the era-mismatched
    # include-fixed/bits/* files that gcc's install-time fixincludes
    # generated from the host's modern glibc headers. They reference
    # symbols (openat2, statx-flags-bits, ...) absent in the old glibc
    # this gcc will build. Also strip the zlib-compressed .debug_info
    # from libgcc/crt so very old binutils ld can read them.
    # No-op for current gcc bottles (>= 10).
    - run: |
        if [ {{version.major}} -lt 10 ]; then
          for d in {{prefix}}/lib/gcc/*/{{version.raw}}/include-fixed; do
            [ -d "$d/bits" ] || continue
            mv "$d/bits" "$d/bits.disabled-by-pantry" || true
            mkdir -p "$d/bits"
          done
          find {{prefix}}/lib/gcc -name 'libgcc*.a' -o -name 'crt*.o' 2>/dev/null | while read f; do
            {{deps.gnu.org/binutils.prefix}}/bin/strip --strip-debug "$f" 2>/dev/null || true
          done
        fi
      if: linux

    # fixincludes can emit a malformed stdio.h against newer macOS SDKs,
    # leaving FILE, fpos_t, and size_t undefined for downstream builds.
    - run:
        - for hdr in lib/gcc/*/*/include-fixed/stdio.h; do
        - if ! grep -q 'extern FILE \*__stdinp' "$hdr" || grep -q '#include <_stdio.h>' "$hdr"; then continue; fi
        - sed -i -f $PROP "$hdr"
        - done
      prop: |
        /#define .*STDIO/a\
        #include <stddef.h>\
        #include <_stdio.h>
      if: darwin
      working-directory: ${{prefix}}

    # Since we depend on ourselves, this symlink might already exist
    - run: test -f gc++ || ln -sf c++ gc++
      working-directory: ${{prefix}}/bin

    # other tools simply expect these symlinks and often fail without them
    # NOTE forcing symlinks because we build with ourselves and sometimes that
    # means we're building with the exact same version FIXME
    - run:
        - ln -sf gcc cc
        - ln -sf ../../../binutils/v\*/bin/ar ar
        - ln -sf ../../../binutils/v\*/bin/nm nm
        - ln -sf ../../../binutils/v\*/bin/ranlib ranlib
      working-directory: ${{prefix}}/bin

    # fixup the signatures on libgcc_s on darwin x86-64
    - run:
        - if test -f libgcc_s.1.1.dylib; then
        - codesign --remove-signature libgcc_s.1.1.dylib || true
        - codesign -s - --force libgcc_s.1.1.dylib
        - fi
        - if test -f libgcc_s.1.dylib; then
        - codesign --remove-signature libgcc_s.1.dylib || true
        - codesign -s - --force libgcc_s.1.dylib
        - fi
      if: darwin/x86-64
      working-directory: ${{prefix}}/lib

    # Many Linux build systems (autoconf, distutils/setuptools, pip
    # build backends) probe for the Debian-style multi-arch triplet
    # binary names ($arch-linux-gnu-gcc, etc.) before falling back to
    # plain `gcc`. Without these, pip-install of C-extension Python
    # wheels fails on Ubuntu/Debian rootfs even when gcc IS on PATH.
    # See pkgxdev/pantry#8423.
    - run:
        - for tool in gcc g++ cpp c++ ar nm ranlib; do
        - if test -e "$tool"; then ln -sf "$tool" "$TRIPLET-$tool"; fi
        - done
      if: linux
      working-directory: ${{prefix}}/bin

    # Linux libc-wrapper: install a thin shim at bin/<compiler> that
    # injects -isystem $glibc/include + -L$glibc/lib so end-user
    # `pkgx +gnu.org/gcc +gnu.org/glibc gcc test.c` finds stdlib.h +
    # crt*.o + libc.so.6 from the pkgx-integrated glibc bottle —
    # without needing distro glibc-devel. See #8423.
    #
    # The wrapper is OPPORTUNISTIC: it looks for a sibling pkgx glibc
    # bottle and injects only if found AND CPATH is unset. If neither
    # condition holds, gcc falls back to the host libc (current
    # behaviour). We intentionally do NOT declare gnu.org/glibc as a
    # runtime dep here — brewkit would then expose it during gcc's own
    # build via CPATH/LIBRARY_PATH, poisoning the bootstrap (test
    # programs end up linking pkgx libc but running on host's ld-linux).
    # Users opt in explicitly with `pkgx +gnu.org/glibc`.
    - run: |
        mkdir -p {{prefix}}/libexec/gcc-wrap
        cat > {{prefix}}/libexec/gcc-wrap/.template <<'WRAPPER'
        #!/bin/sh
        # pkgx GCC libc-wrapper (generated per-tool — no $0 basename muxing).
        # @TARGET@ / @CXX@ are baked in at install time so this shim never has
        # to infer WHICH compiler it stands in for from $0 (jhheider, #13094).
        target=@TARGET@
        cxx=@CXX@

        # Locate ourselves by CANONICALIZING $0 through every symlink — the
        # sh-script analogue of /proc/self/exe (which for a #!/bin/sh script
        # would be the interpreter, /bin/sh, not us). bin/<tool>, the triplet
        # symlinks, and even an external symlink into us all resolve back to the
        # one real wrapper at <prefix>/libexec/gcc-wrap/<tool>. WHICH compiler we
        # are is $target, so $0 is used only to find our location, never the tool.
        case "$0" in
          */*) invoked=$0 ;;
          *)   invoked=$(command -v -- "$0" 2>/dev/null || echo "$0") ;;
        esac
        self=$(readlink -f -- "$invoked" 2>/dev/null) || self=
        [ -n "$self" ] || self=$invoked
        selfdir=${self%/*}
        # Canonical layout: <prefix>/libexec/gcc-wrap/<tool> -> bin is ../../bin.
        # -P everywhere so we work in PHYSICAL paths, never symlink names.
        if [ -d "$selfdir/../../bin" ]; then
          bindir=$(CDPATH= cd -P -- "$selfdir/../../bin" && pwd -P)
        else
          bindir=$(CDPATH= cd -P -- "$selfdir" && pwd -P)
        fi
        gcc_root=$(CDPATH= cd -P -- "$bindir/.." && pwd -P)

        # Real driver stays in bin/ as .<target>-real so gcc's own relative lookup
        # of cc1/cc1plus/collect2 (under libexec/gcc/<triplet>/<ver>/) keeps working.
        real="$bindir/.${target}-real"
        [ -x "$real" ] || real="$bindir/$target"

        # Opt in only when a sibling pkgx glibc bottle exists and CPATH is unset.
        # pkgx installs a literal 'v*' convenience symlink alongside the real
        # vX.Y.Z dir (and the glob stays literal if nothing matches at all), so
        # SKIP any candidate ending in '*' — otherwise 'v*' sorts first (ASCII
        # '*' < digits) and its name leaks unexpanded into PT_INTERP. Resolve
        # the chosen dir PHYSICALLY (cd -P / pwd -P) so no symlink name
        # (v2 / v2.44 / the sibling glibc symlink) survives into $libc either.
        libc=
        if [ -z "$CPATH" ]; then
          for cand in "$bindir/../../../glibc/v"*; do
            case "$cand" in *'*') continue ;; esac
            [ -d "$cand/include" ] || continue
            libc=$(CDPATH= cd -P -- "$cand" && pwd -P) && break
          done
        fi
        [ -n "$libc" ] || exec "$real" "$@"

        # glibc bottle keeps crt*.o / libc.so.6 / ld-linux*.so.* in a versioned
        # sub-libdir (lib/glibc-X.Y), NOT directly in lib/. Find it via libc.so.6.
        libcdir=
        for c in "$libc"/lib/glibc-*/libc.so.6 "$libc"/lib/libc.so.6; do
          [ -f "$c" ] && libcdir=${c%/libc.so.6} && break
        done
        [ -n "$libcdir" ] || exec "$real" "$@"

        ldso=
        for l in "$libcdir"/ld-linux*.so.* "$libcdir"/ld.so; do
          [ -e "$l" ] && ldso=$l && break
        done

        # gcc's own builtin headers (dropped by -nostdinc, re-added here).
        gcc_inc= gcc_inc_fixed=
        for inc in "$gcc_root"/lib/gcc/*/*/include; do
          [ -d "$inc" ] && gcc_inc=$inc && break
        done
        [ -n "$gcc_inc" ] && [ -d "${gcc_inc}-fixed" ] && gcc_inc_fixed=${gcc_inc}-fixed

        # libstdc++ headers (dropped by -nostdinc++, re-added for C++ drivers).
        cxx_flag= cxx_inc= cxx_arch_inc= cxx_back_inc=
        if [ "$cxx" = 1 ]; then
          cxx_flag=-nostdinc++
          for ci in "$gcc_root"/include/c++/*; do
            [ -d "$ci" ] && [ -f "$ci/vector" ] && cxx_inc=$ci && break
          done
          if [ -n "$cxx_inc" ]; then
            for ai in "$cxx_inc"/*-linux-gnu; do
              [ -d "$ai" ] && cxx_arch_inc=$ai && break
            done
            [ -d "$cxx_inc/backward" ] && cxx_back_inc="$cxx_inc/backward"
          fi
        fi

        exec "$real" \
          -nostdinc $cxx_flag \
          ${cxx_inc:+-isystem "$cxx_inc"} \
          ${cxx_arch_inc:+-isystem "$cxx_arch_inc"} \
          ${cxx_back_inc:+-isystem "$cxx_back_inc"} \
          ${gcc_inc:+-isystem "$gcc_inc"} \
          ${gcc_inc_fixed:+-isystem "$gcc_inc_fixed"} \
          -isystem "$libc/include" \
          -B "$libcdir" \
          -L "$libcdir" \
          ${ldso:+-Wl,--dynamic-linker="$ldso"} \
          -Wl,-rpath,"$libcdir" \
          -Wl,-rpath,"$gcc_root/lib" \
          "$@"
        WRAPPER
        # Generate one wrapper per tool (target + c++-ness baked in), so the
        # shim never muxes on $0. bin/<tool> -> ../libexec/gcc-wrap/<tool>;
        # real driver preserved as bin/.<tool>-real.
        cd {{prefix}}/bin
        for spec in gcc:0 g++:1 cpp:0 c++:1 gfortran:0; do
          tool=${spec%:*}; cxx=${spec#*:}
          [ -f "$tool" ] && [ ! -L "$tool" ] || continue
          sed -e "s/@TARGET@/$tool/g" -e "s/@CXX@/$cxx/g" \
            {{prefix}}/libexec/gcc-wrap/.template > {{prefix}}/libexec/gcc-wrap/$tool
          chmod +x {{prefix}}/libexec/gcc-wrap/$tool
          mv "$tool" ".${tool}-real"
          ln -sf ../libexec/gcc-wrap/$tool "$tool"
        done
        rm -f {{prefix}}/libexec/gcc-wrap/.template
      if: linux

  env:
    # Branch from the Darwin maintainer of GCC, with a few generic fixes and
    # Apple Silicon support, located at https://github.com/iains/gcc-12-branch
    PATCH122: https://raw.githubusercontent.com/Homebrew/formula-patches/1d184289/gcc/gcc-12.2.0-arm.diff
    # https://github.com/iains/gcc-darwin-arm64
    PATCH131: https://raw.githubusercontent.com/Homebrew/formula-patches/master/gcc/gcc-13.1.0.diff
    BRANCH105: https://github.com/iains/gcc-10-branch/archive/refs/heads/gcc-10-5Dr0-pre-0.tar.gz
    BRANCH114: https://github.com/iains/gcc-11-branch/archive/refs/tags/gcc-11.4-darwin-r0.tar.gz
    BRANCH115: https://github.com/iains/gcc-11-branch/archive/refs/tags/gcc-11.5-darwin-r0.tar.gz
    BRANCH123: https://github.com/iains/gcc-12-branch/archive/refs/tags/gcc-12.3-darwin-r0.tar.gz
    BRANCH124: https://github.com/iains/gcc-12-branch/archive/refs/heads/gcc-12-4-darwin.tar.gz
    # no branch for 12.5
    BRANCH125: https://github.com/iains/gcc-12-branch/archive/refs/heads/gcc-12-4-darwin.tar.gz
    BRANCH132: https://github.com/iains/gcc-13-branch/archive/refs/heads/gcc-13-2-darwin.tar.gz
    BRANCH133: https://github.com/iains/gcc-13-branch/archive/refs/heads/gcc-13-3-darwin.tar.gz
    BRANCH134: https://github.com/iains/gcc-13-branch/archive/refs/heads/gcc-13-4-darwin-p0.tar.gz
    BRANCH141: https://github.com/iains/gcc-14-branch/archive/refs/heads/gcc-14-1-darwin.tar.gz
    BRANCH142: https://github.com/iains/gcc-14-branch/archive/refs/heads/gcc-14-2-darwin.tar.gz
    BRANCH143: https://github.com/iains/gcc-14-branch/archive/refs/heads/gcc-14-3-darwin-pre-0.tar.gz
    BRANCH151: https://github.com/iains/gcc-15-branch/archive/refs/heads/gcc-15-1-darwin-rc1.tar.gz
    BRANCH152: https://github.com/iains/gcc-15-branch/archive/refs/heads/gcc-15-2-darwin-pre-0.tar.gz
    BRANCH153: https://github.com/iains/gcc-darwin-arm64/archive/refs/heads/master-wip-apple-si-on-r15-9392-g711c10383f494b.tar.gz
    BRANCH161: https://github.com/iains/gcc-darwin-arm64/archive/refs/heads/master-wip-apple-si-on-r16-8803-g376d03b7b44da2.tar.gz
    ARGS:
      - --prefix={{ prefix }}
      - --libdir={{ prefix }}/lib
      - --enable-languages=c,c++,objc,obj-c++,fortran
      - --with-bugurl="https://github.com/pkgxdev/pantry/issues"
      - --disable-bootstrap
      - --disable-nls
      - --with-system-zlib
    linux:
      ARGS:
        - --disable-multilib
    linux/x86-64:
      LDFLAGS:
        - -pie
      CFLAGS:
        - -fPIC
        - -fPIE
      CXXFLAGS:
        - -fPIC
        - -fPIE
    darwin:
      LDFLAGS: $LDFLAGS -Wl,-headerpad_max_install_names
      ARGS:
        # Reliance on CLT hard path is yuck.
        - --with-sysroot=/Library/Developer/CommandLineTools/SDKs/MacOSX.sdk
    darwin/aarch64:
      ARGS:
        # https://en.wikipedia.org/wiki/Darwin_(operating_system)#Darwin_16%E2%80%9319;_OS_X_rebranded_into_macOS
        - --build=aarch64-apple-darwin20.0.0
    darwin/x86-64:
      ARGS:
        - --build=x86_64-apple-darwin20.0.0
      # llvm-as generates __compact_unwind sections, even when told not to. this causes build errors
      # for ^10 on darwin+x86-64
      # https://stackoverflow.com/questions/52211390/trouble-building-gcc-on-mac-cant-find-system-headers
      BOOT_CFLAGS:
        - -Wa,-mmacos-version-min=10.5
      CFLAGS_FOR_TARGET:
        - -Wa,-mmacos-version-min=10.5
        # 15.3+ libgcc2.c v* overflow funcs emit `.cfi_advance_loc` symdiffs
        # across abort() noreturn edges that LLVM's integrated `as` rejects
        # with "invalid CFI advance_loc expression". Emit unwind via .eh_frame
        # instead of inline .cfi_* asm directives.
        - -fno-dwarf2-cfi-asm
      CXXFLAGS_FOR_TARGET:
        - -Wa,-mmacos-version-min=10.5
        - -fno-dwarf2-cfi-asm
    # triplets for linux
    x86-64:
      TRIPLET: x86_64-linux-gnu
    aarch64:
      TRIPLET: aarch64-linux-gnu

test:
  # glibc is a linux-only test dep so the wrapper test below has a sibling
  # pkgx glibc bottle to inject (the whole point of the feature).
  dependencies:
    linux:
      gnu.org/glibc: '*'
  script:
    - gcc --version | grep -q "pkgx GCC {{version}}"
    - gcc -print-libgcc-file-name
    - gcc -print-multiarch
    # some gha mac runners have broken SDKs...
    - run:
        - if ! test -f /Library/Developer/CommandLineTools/SDKs/MacOSX.sdk/usr/include/AvailabilityInternalLegacy.h || ! test -f ; then
        - echo "Missing SDK; skipping remaining tests"
        - exit 0
        - fi
      if: darwin
    - run:
        - if test "{{hw.platform}}" = "darwin" && test ! -f /Library/Developer/CommandLineTools/SDKs/MacOSX.sdk/usr/include/_bounds.h ; then
        - echo "Missing SDK; skipping remaining tests"
        - exit 0
        - fi
      if: "^14.2 || >=15.2"
    - gcc -o test1 test.c -lgmp
    - ./test1
    - g++ -o test2 test.cc
    - test "$(./test2)" = "Hello, world!"
    - gfortran -o test3 test.f90
    - test "$(./test3)" = "Hello, world!"
    # libc-wrapper (#13094): with a sibling pkgx glibc bottle and CPATH
    # unset, gcc/g++ must compile+link+RUN against that glibc — i.e. the
    # produced binary's PT_INTERP is the bottle's ld.so — and must NO-OP
    # (fall back to host libc) when CPATH is set. brewkit's own test env
    # keeps CPATH populated (dep includes), so the pre-existing steps above
    # stay on host libc; we drive the wrapper explicitly with `CPATH=`.
    - run: |
        set -eu
        interp_of() { readelf -l "$1" | sed -n 's/.*program interpreter: \(.*\)]/\1/p'; }

        # (0) Host / no-op baseline: with CPATH set the wrapper stays dormant,
        #     so this binary uses the HOST loader. Header-less so it needs no
        #     glibc headers. We do NOT hardcode the pkgx prefix (brewkit does
        #     not template {{deps.*.prefix}} for test deps) — we compare the
        #     wrapped build against this captured host interpreter instead.
        echo 'int main(void){return 0;}' > noop.c
        CPATH=1 gcc noop.c -o noop
        host_interp=$(interp_of noop)
        echo "host  PT_INTERP: $host_interp"
        case "$host_interp" in
          */glibc-*/ld-*) echo "FAIL: CPATH-set build should use host libc, got '$host_interp'"; exit 1 ;;
          *) echo "PASS: CPATH-set no-op uses host libc" ;;
        esac

        # (1) C: -nostdinc drops host headers, so stdio.h must come from the
        #     injected pkgx glibc; PT_INTERP must switch to the glibc bottle's
        #     ld.so in its glibc-X.Y sub-libdir — fully resolved (no glob/
        #     symlink residue like a literal 'v*') — and the binary must RUN.
        printf '#include <stdio.h>\nint main(void){ printf("wrap-ok\\n"); return 0; }\n' > wrap.c
        CPATH= gcc wrap.c -o wrap
        interp=$(interp_of wrap)
        echo "C     PT_INTERP: $interp"
        test "$interp" != "$host_interp" || { echo "FAIL: wrapper did not change PT_INTERP"; exit 1; }
        case "$interp" in
          *'*'*) echo "FAIL: PT_INTERP has an unexpanded glob: '$interp'"; exit 1 ;;
        esac
        case "$interp" in
          */glibc-*/ld-*) : ;;
          *) echo "FAIL: PT_INTERP is not a pkgx glibc sub-libdir loader: '$interp'"; exit 1 ;;
        esac
        test -e "$interp" || { echo "FAIL: PT_INTERP path does not exist: '$interp'"; exit 1; }
        out=$(./wrap); test "$out" = "wrap-ok" || { echo "FAIL: C binary did not run (got '$out')"; exit 1; }
        echo "PASS: C compiled+linked+ran against the pkgx glibc bottle"

        # (2) C++: exercises -nostdinc++ + libstdc++ header re-add + the
        #     libstdc++/libgcc_s runtime rpath.
        printf '#include <vector>\n#include <cstdio>\nint main(){ std::vector<int> v; v.push_back(7); printf("%%d\\n", v[0]); return 0; }\n' > wrap.cc
        CPATH= g++ wrap.cc -o wrapxx
        interpxx=$(interp_of wrapxx)
        echo "C++   PT_INTERP: $interpxx"
        case "$interpxx" in *'*'*) echo "FAIL: C++ PT_INTERP has glob residue: '$interpxx'"; exit 1 ;; esac
        case "$interpxx" in
          */glibc-*/ld-*) : ;;
          *) echo "FAIL: C++ PT_INTERP is not the pkgx glibc loader: '$interpxx'"; exit 1 ;;
        esac
        test "$(./wrapxx)" = "7" || { echo "FAIL: C++ binary did not run/print 7"; exit 1; }
