distributable:
  # the tuxfamily 2.3.4 tarball ships a zero-byte include/miniupnpc.h; the git tag is fine
  url: https://github.com/miniupnp/miniupnp/archive/refs/tags/miniupnpc_{{version.major}}_{{version.minor}}_{{version.patch}}.tar.gz
  strip-components: 1

versions:
  url: https://miniupnp.tuxfamily.org/files
  match: /miniupnpc-\d+(\.\d+)+.tar.gz/
  strip:
    - /^miniupnpc-/
    - /\.tar\.gz$/

build:
  - run: make INSTALLPREFIX={{prefix}} install
    working-directory: miniupnpc

provides:
  - bin/external-ip
  - bin/upnp-listdevices
  - bin/upnpc

test:
  - (upnpc -l 2>&1 || true) | tee out
  - grep 'List of UPNP devices found on the network' out || grep 'No IGD UPnP Device found on the network' out
  - upnpc --help 2>&1 | tee out
  - grep 'version {{version.raw}}' out
