distributable:
  url: https://github.com/yaml/libyaml/releases/download/{{version}}/yaml-{{version}}.tar.gz
  strip-components: 1

versions:
  github: yaml/libyaml/tags
  # strip: /^v/

build:
  script: |
    ./configure --prefix="{{prefix}}"
    make --jobs {{hw.concurrency}} install

test:
  script: |
    cc test.c -lyaml
    ./a.out
