distributable:
  url: https://github.com/yaml/libyaml/releases/download/{{version}}/yaml-{{version}}.tar.gz
  strip-components: 1

versions:
  github: yaml/libyaml

build:
  dependencies:
    gnu.org/libtool: '*'
    gnu.org/autoconf: '*'
  script:
    - ./configure $ARGS
    - make --jobs {{ hw.concurrency }} install
    # 0.2.6 raised the libtool AGE without raising CURRENT, which on linux turns the
    # soname from libyaml-0.so.2 into libyaml-0.so.1 and breaks every binary linked
    # against 0.2.5 (shards: "libyaml-0.so.2: cannot open shared object file").
    # the ABI is compatible, so keep the old name resolvable. 0.2.7 reverted the
    # change and ships so.2 itself, so only add it when it is missing.
    - run: if test -f libyaml-0.so.1 && ! test -e libyaml-0.so.2; then ln -s libyaml-0.so.1 libyaml-0.so.2; fi
      working-directory: ${{prefix}}/lib
      if: linux
  env:
    ARGS:
      - --prefix="{{prefix}}"

test:
  script:
    - cc fixture.c -lyaml -o test
    - ./test
    - run: test -e {{prefix}}/lib/libyaml-0.so.2
      if: linux
