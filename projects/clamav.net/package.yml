distributable:
  url: https://github.com/Cisco-Talos/clamav/releases/download/{{version.tag}}/{{version.tag}}.tar.gz
  strip-components: 1

display-name: ClamAV

versions:
  github: Cisco-Talos/clamav/tags
  strip: /^clamav-/

dependencies:
  curl.se: "*"
  github.com/json-c/json-c: "*"
  gnome.org/libxml2: "~2.13"
  invisible-island.net/ncurses: "*"
  openssl.org: ^1.1 # curl.se pins 1.1
  pcre.org/v2: "*"
  sourceware.org/bzip2: "*"
  zlib.net: "*"
  linux:
    gnu.org/libiconv: ^1

# the certs dir is baked in with the +brewing prefix, which no longer exists
# once brewkit renames the install dir
runtime:
  env:
    CVD_CERTS_DIR: ${{prefix}}/etc/certs

build:
  dependencies:
    cmake.org: ^3
    gnu.org/bison: "*"
    github.com/westes/flex: "*"
    rust-lang.org: ^1
    rust-lang.org/cargo: "*"
  working-directory: build
  script:
    - cmake .. $ARGS
    - make --jobs {{ hw.concurrency }} install

    # ClamAV bakes its config and database paths in at build time, with the
    # +brewing prefix and a build-machine pkgx dir; wrap the tools that use
    # them so they find the real install at runtime
    - run:
        - mkdir -p libexec
        - for x in clamscan freshclam clamdscan clamdtop clamconf; do
        - mv bin/$x libexec/$x
        - cp $PROP bin/$x
        - chmod +x bin/$x
        - done
        - mv sbin/clamd libexec/clamd
        - cp $PROP sbin/clamd
        - chmod +x sbin/clamd
        - echo "DatabaseMirror database.clamav.net" > etc/freshclam.conf
        - echo "DatabaseOwner root" >> etc/freshclam.conf
        - echo "TCPSocket 3310" > etc/clamd.conf
        - echo "TCPAddr 127.0.0.1" >> etc/clamd.conf
      working-directory: ${{prefix}}
      prop: |
        #!/bin/sh
        d=$(cd "$(dirname "$0")/.." && pwd)
        n=$(basename "$0")
        b="$d/libexec/$n"
        db="$d/share/clamav"
        # the user's own flags come first, so they win
        case $n in
          clamscan)
            for a; do
              case $a in -d|--database|--database=*) exec "$b" "$@";; esac
            done
            exec "$b" --database="$db" "$@";;
          freshclam) exec "$b" "$@" --config-file="$d/etc/freshclam.conf" --datadir="$db";;
          clamd) exec "$b" "$@" --config-file="$d/etc/clamd.conf" --datadir="$db";;
          clamdscan|clamdtop) exec "$b" "$@" --config-file="$d/etc/clamd.conf";;
          clamconf) exec "$b" "$@" --config-dir="$d/etc";;
        esac
  env:
    ARGS:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_PREFIX="{{prefix}}"
      - -DENABLE_TESTS=OFF
      - -DENABLE_MAN_PAGES=OFF
      - -DENABLE_EXAMPLES=OFF
      - -DENABLE_MILTER=OFF
      - -DENABLE_SYSTEMD=OFF
      - -DENABLE_JSON_SHARED=ON

provides:
  - bin/clamscan
  - bin/clamsubmit
  - bin/clamdscan
  - bin/clamconf
  - bin/clamdtop
  - bin/clambc
  - bin/freshclam
  - bin/sigtool
  - sbin/clamd

test:
  env:
    CVD_CERTS_DIR: ${{prefix}}/etc/certs
  script:
    # clamscan refuses to run without a database, so make a one-signature
    # database for a file we write ourselves
    - echo "pantry clamav test payload" > payload.txt
    - sigtool --md5 payload.txt > test.hdb
    # exit status 1 means "virus found"
    - clamscan --database=test.hdb payload.txt > out.txt || test $? -eq 1
    - grep -F 'payload.txt.UNOFFICIAL FOUND' out.txt
    - clamscan --version | grep {{version}}
    # the wrappers must point at the real install, not the +brewing build path
    - clamscan payload.txt > err.txt 2>&1 || test $? -eq 2
    - grep -F '{{prefix}}/share/clamav' err.txt
    - freshclam --version | grep {{version}}
    - clamconf | grep -F '{{prefix}}/etc'
    - clamdtop --version | grep {{version}}
    - clambc --version | grep {{version}}
    - clamsubmit -h 2>&1 | grep {{version}}
    # the daemon and its client, on the default config (localhost TCP)
    - mkdir db
    - cp test.hdb db/
    - clamd --datadir=db --pid=$PWD/clamd.pid
    - clamdscan --wait payload.txt > dout.txt || test $? -eq 1
    - kill $(cat clamd.pid)
    - grep -F 'payload.txt.UNOFFICIAL FOUND' dout.txt
