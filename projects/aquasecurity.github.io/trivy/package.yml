distributable:
  url: git+https://github.com/aquasecurity/trivy.git
  ref: v{{version}}

versions:
  # trivy's GitHub releases (~5MB of notes per page) and tags (GraphQL) both
  # fail in CI; the Go module proxy lists the same vX.Y.Z tags in plain text
  url: https://proxy.golang.org/github.com/aquasecurity/trivy/@v/list
  # the proxy still lists tags upstream deleted (0.69.4 was GHSA-69fq-xp46-6x23);
  # url versions don't read `ignore:`, so match skips them
  match: /v(?!0\.50\.3\b|0\.51\.3\b|0\.69\.4\b)\d+\.\d+\.\d+/
  strip: /^v/

dependencies:
  curl.se/ca-certs: '*'

build:
  dependencies:
    go.dev: =1.25 # as of 0.67.0
  script:
    - run: export GOEXPERIMENT=jsonv2
      if: '>=0.67.0'
    - go build $ARGS -ldflags="$GO_LDFLAGS" ./cmd/trivy
  env:
    ARGS:
      - -trimpath
      - -o={{prefix}}/bin/trivy
    GO_LDFLAGS:
      - -s
      - -w
      - -X github.com/aquasecurity/trivy/pkg/version.ver={{version}}
      - -X github.com/aquasecurity/trivy/pkg/version/app.ver={{version}}
    # as upstream's goreleaser does; cgo dragged in gcc, and gcc 16's
    # aarch64 build attributes are beyond binutils 2.44's assembler
    CGO_ENABLED: 0
    linux:
      GO_LDFLAGS:
        - -buildmode=pie

provides:
  - bin/trivy

test:
  - trivy image alpine:3.10
  - trivy --version | grep {{version}}
