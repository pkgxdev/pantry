distributable:
  url: https://github.com/getzola/zola/archive/refs/tags/{{ version.tag }}.tar.gz
  strip-components: 1

provides:
  - bin/zola

versions:
  github: getzola/zola

build:
  dependencies:
    rust-lang.org: '>=1.65'
    rust-lang.org/cargo: '*'
    crates.io/edikt: "*"
  script:
    # missing version bump
    - edikt -i '.workspace.package.version = "{{version}}"' Cargo.toml
    - cargo install --path . --root {{prefix}}

test:
  script:
    - test "$(zola --version)" = "zola {{version}}"
