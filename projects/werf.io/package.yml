distributable:
  url: https://github.com/werf/werf/archive/{{version.tag}}.tar.gz
  strip-components: 1

versions:
  github: werf/werf

build:
  dependencies:
    go.dev: ~1.26.3
    linux:
      gnu.org/gcc: 14
      gnu.org/binutils: ~2.44 # some go packages demand ld.gold, but it's being deprecated
      github.com/kdave/btrfs-progs: ^6.7
  script: go build $ARGS -ldflags="$GO_LDFLAGS" -tags="$TAGS" ./cmd/werf
  env:
    TAGS:
      - dfrunsecurity
      - dfrunnetwork
      - dfrunmount
      - dfssh
      - containers_image_openpgp
    GO_LDFLAGS:
      - -s
      - -w
      # 3.6.0 bumped the Go module path v2 -> v3, changing the -X symbol
      # path; unknown -X targets are silently ignored by the linker, so
      # older/newer entries coexist harmlessly (keep for older versions).
      - -X github.com/werf/werf/pkg/werf.Version={{version}}
      - -X github.com/werf/werf/v2/pkg/werf.Version={{version}}
      - -X github.com/werf/werf/v3/pkg/werf.Version={{version}}
    linux:
      GO_LDFLAGS:
        - -linkmode external
        - -extldflags=-static
        - -buildmode=pie
      TAGS:
        - osusergo
        - exclude_graphdriver_devicemapper
        - netgo
        - no_devmapper
        - static_build
        - cni
    ARGS:
      - -v
      - -trimpath
      - -o={{prefix}}/bin/werf

provides:
  - bin/werf

test:
  dependencies:
    git-scm.org: "*"
  script:
    - werf version | grep {{version}}
    - run: cp $FIXTURE werf.yaml
      fixture: |
        configVersion: 1
        project: quickstart-application
        ---
        image: vote
        dockerfile: Dockerfile
        context: vote
        ---
        image: result
        dockerfile: Dockerfile
        context: result
        ---
        image: worker
        dockerfile: Dockerfile
        context: worker
    - git init
    - git config user.email "bot@pkgx.dev"
    - git config user.name "pkgxbot"
    - git add werf.yaml
    - git commit -m "Initial commit"
    - run: werf config list | grep result
      if: <1.2
    - run: werf config graph | grep result
      if: ">=1.2"
