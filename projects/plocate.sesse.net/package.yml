distributable:
  url: https://plocate.sesse.net/download/plocate-{{version}}.tar.gz
  # 1.1.25 is flat; older tarballs nest under plocate-VERSION/

versions:
  url: https://plocate.sesse.net/download/
  match: /plocate-\d+\.\d+\.\d+.tar.gz/
  strip:
    - /^plocate-/
    - /\.tar\.gz$/

platforms: [linux]

dependencies:
  facebook.com/zstd: 1
  gnu.org/gcc/libstdcxx: 14

build:
  dependencies:
    mesonbuild.com: ^1
    cmake.org: ^3
    ninja-build.org: ^1
    gnu.org/gcc: '*'
  script:
    # 1.1.25 tarball is flat; older ones nest under plocate-VERSION/
    - run: |
        if test -d plocate-{{version}}; then
          mv plocate-{{version}}/* .
          rm -rf plocate-{{version}}
        fi
    # duplicate struct definitions
    - test ! -f io_uring_engine.h || sed -i '/<linux\/stat.h>/d' io_uring_engine.h
    # don't run the installer after build
    - sed -i '/mkdir.sh/s/^/#/' meson.build
    - meson setup build $ARGS
    - ninja -C build
    - ninja -C build install
  env:
    ARGS:
      - --prefix={{prefix}}
      - --buildtype=release
      - -Dinstall_systemd=false
      - -Dsharedstatedir=/var/lib # hardcoded
      - -Dsystemunitdir={{prefix}}/lib/systemd/system

provides:
  - bin/plocate
  - sbin/plocate-build
  - sbin/updatedb

test:
  - plocate --version | grep "plocate {{version}}"
  # running updatedb to index the drive is overkill
  - 'test "$(plocate pkgx 2>&1 || true)" = "/var/lib/plocate/plocate.db: No such file or directory"'
