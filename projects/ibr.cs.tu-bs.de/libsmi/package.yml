distributable:
  url: https://gitlab.ibr.cs.tu-bs.de/nm/libsmi/-/archive/v{{version}}/libsmi-v{{version}}.tar.gz
  strip-components: 1

# the download page moved to GitLab and its numbers (dates, old versions) are not releases
versions:
  url: https://gitlab.ibr.cs.tu-bs.de/api/v4/projects/nm%2Flibsmi/releases
  match: /v\d+\.\d+\.\d+/
  strip: /^v/

build:
  dependencies:
    # the macOS /usr/bin/bison is 2.3, too old for the parser grammars
    gnu.org/bison: '*'
    # configure needs flex too: "flex and bison are required to build from a git checkout"
    github.com/westes/flex: '*'
    gnu.org/autoconf: '*'
    gnu.org/automake: '*'
    gnu.org/libtool: '*'
  script: |
    autoreconf --force --install --verbose
    ./configure $ARGS
    make --jobs {{ hw.concurrency }} install
  env:
    ARGS:
      - --prefix="{{prefix}}"
      - --disable-debug
      - --disable-dependency-tracking

provides:
  - bin/smidiff
  - bin/smidump
  - bin/smilint
  - bin/smiquery
  - bin/smixlate

test:
  smidiff --version | grep {{version}}