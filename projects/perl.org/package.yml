distributable:
  url: https://www.cpan.org/src/{{ version.major }}.0/perl-{{ version }}.tar.xz
  strip-components: 1

versions:
  github: perl/perl5/tags
  ignore: /^v\d+\.\d*[13579]\.\d+$/
  # ^^ perl considers odd minor versions “dev” releases

dependencies:
  linux:
    github.com/besser82/libxcrypt: ^4

build:
  dependencies:
    linux:
      llvm.org: <19
      gnu.org/make: '*'
  script: |
    ./Configure $ARGS
    make --jobs {{ hw.concurrency }} install

    cd "{{prefix}}"/bin
    for x in *; do
      case $x in
      perl|perl{{version}})
        ;;
      *)
        sed -i.bak 's|^#!{{prefix}}/bin/|#!/usr/bin/env |' $x
        sed -i.bak 's|exec {{prefix}}/bin/|exec |' $x
      esac
    done

    rm -f *.bak

    if test "{{hw.platform}}" = "linux"; then
      if objdump -T "{{prefix}}/bin/perl" | grep -q 'crypt_r.*GLIBC'; then
        echo "perl linked crypt_r against the host libcrypt" >&2
        exit 1
      fi
      resolved=$(ldd "{{prefix}}/bin/perl" | awk '/libcrypt\.so\.1/ {print $3}')
      case "$resolved" in
      *libxcrypt*) ;;
      *)
        echo "libcrypt.so.1 resolved outside libxcrypt: ${resolved:-not found}" >&2
        exit 1
        ;;
      esac
    fi

  # relocatable fixes from: https://github.com/skaji/relocatable-perl

  env:
    ARGS:
      - -d  # use defaults
      - -e  # non interactive
      - -Dprefix={{prefix}}
      - -Duselargefiles
      - -Dusethreads
      - -Duseshrplib=false
      # makes perl “more” relocatable
      - -Duserelocatableinc
    linux:
      ARGS:
        - -Accflags=-fPIC
        # Configure probes host libcrypt before the pkgx prefix.
        - -Aldflags=-L{{deps.github.com/besser82/libxcrypt.prefix}}/lib

test:
  script: |
    perl $FIXTURE
    shasum --version
  fixture: |
    print 'Perl is not an acronym, but JAPH is a Perl acronym!'

provides:
  - bin/corelist
  - bin/cpan
  - bin/enc2xs
  - bin/encguess
  - bin/h2ph
  - bin/h2xs
  - bin/instmodsh
  - bin/json_pp
  - bin/libnetcfg
  - bin/perl
  - bin/perlbug
  - bin/perldoc
  - bin/perlivp
  - bin/perlthanks
  - bin/piconv
  - bin/pl2pm
  - bin/pod2html
  - bin/pod2man
  - bin/pod2text
  - bin/pod2usage
  - bin/podchecker
  - bin/prove
  - bin/ptar
  - bin/ptardiff
  - bin/ptargrep
  - bin/shasum
  - bin/splain
  - bin/streamzip
  - bin/xsubpp
  - bin/zipdetails

interprets:
  extensions: pl
  args: perl
