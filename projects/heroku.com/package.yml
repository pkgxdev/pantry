distributable:
  url: https://registry.npmjs.org/heroku/-/heroku-{{version}}.tgz
  strip-components: 1

versions:
  npm: heroku

dependencies:
  nodejs.org: ^20

build:
  dependencies:
    npmjs.com: '*'
    github.com/mikefarah/yq: '>=4' # safe-edit json bin field
  script:
    # v11+: bin field points to ./bin/run but file is ./bin/run.js
    - run: |
        if ! test -f bin/run && test -f bin/run.js; then
          yq -i '(.. | select(. == "./bin/run")) = "./bin/run.js"' package.json
        fi
    - npm i $ARGS .
  env:
    ARGS:
      - --global
      - --prefix={{prefix}}
      - --install-links

provides:
  - bin/heroku

test:
  - heroku --version | grep {{version}}
  - heroku --help
  - (heroku authorizations:create -d "getting started token" 2>&1 <<< q || true) | tee out.log
  - run: grep "Press any key to open up the browser to login" out.log
    if: <11.11
  - run: grep "Cannot prompt for login in a non-interactive terminal" out.log
    if: ">=11.11"
