distributable:
  url: https://github.com/openai/codex/archive/refs/tags/{{ version.tag }}.tar.gz
  strip-components: 1

provides:
  - bin/codex
  - bin/codex-exec
  - bin/codex-tui
  - bin/md-events

versions:
  github: openai/codex
  strip: /^rust-v/

companions:
  crates.io/ripgrep: "*"
  git-scm.org: ">=2.39"

dependencies:
  linux:
    kernel.org/libcap: ^1

build:
  dependencies:
    rust-lang.org: "~1.95.0" # since 0.135.0
  script:
    # async state machines can exceed the default recursion limit (128)
    - run: sed -i -f $PROP exec/src/main.rs cli/src/main.rs tui/src/main.rs
      if: ^0.154
      prop: |
        1i #![recursion_limit = "256"]
      working-directory: codex-rs
    - cargo install --locked --path codex-rs/exec --root {{prefix}}
    - cargo install --locked --path codex-rs/cli --root {{prefix}}
    - cargo install --locked --path codex-rs/tui --root {{prefix}}
  env:
    OPENSSL_STATIC: 1
    linux:
      # big job sigkills; workspace's fat LTO + codegen-units=1 OOMs during final link
      CARGO_BUILD_JOBS: 1
      RUSTFLAGS: -C codegen-units=1
      CARGO_PROFILE_RELEASE_LTO: "off"

test:
  # issue #11669
  # ensure libssl is not dynamically linked
  - run: if ldd {{prefix}}/bin/codex | grep libssl; then echo "libssl linked"; exit 1; fi
    if: linux
  - codex --help
  - test "$(codex --version)" = "codex-cli {{version}}"
