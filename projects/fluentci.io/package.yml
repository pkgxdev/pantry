distributable:
  url: https://github.com/fluentci-io/fluentci/archive/refs/tags/v{{ version }}.tar.gz
  strip-components: 1

display-name: fluentci

versions:
  github: fluentci-io/fluentci

dependencies:
  dagger.io: ^0.10
  deno.land: ^1.42
  charm.sh/glow: ^1.5.1

build:
  dependencies:
    bun.sh: ^1 # 0.17 rewrote the cli in rust, with an embedded web ui
    rust-lang.org: '>=1.90'
    rust-lang.org/cargo: '*'
  script:
    # 0.12.0 didn't bump version
    - run: sed -i -e 's/export const VERSION = ".*";/export const VERSION = "{{ version }}";/' consts.ts
      working-directory: src
      if: <0.17
    # 0.12.7+ shipped with a deno.lock that prevents building, 0.16.5 shipped with a v4, 0.16.7 shipper with a v5
    - run: rm deno.lock
      if: '>=0.12.7<0.14 || =0.16.5 || >=0.16.7<0.17'
    - run:
        - deno compile -A --unstable --import-map="$SRCROOT"/import_map.json --output fluentci ./main.ts
        - mkdir -p "{{ prefix }}"/bin
        - cp fluentci "{{ prefix }}"/bin
      if: <0.17

    - run:
        - bun install --frozen-lockfile --ignore-scripts
        - bun run --cwd webui build:web
        - cargo install --locked --path . --root "{{ prefix }}"
      if: '>=0.17'
  skip: fix-patchelf
  env:
    linux/aarch64:
      # deno's pre-built runtime doesn't support glibc old enough
      DENORT_BIN: '{{deps.deno.land.prefix}}/bin/denort'

provides:
  - bin/fluentci

test:
  - fluentci --version
  # contains shell escapes; can't use test
  - fluentci --version | grep {{ version }}
  # scaffolds from the embedded templates, then reads the project db back
  - run:
      - cd "$(mktemp -d)" # outside a git repo, or init targets its root
      - fluentci init </dev/null
      - test -f .fluentci/main/Cargo.toml
      - fluentci workflows | grep default
    if: '>=0.17'
