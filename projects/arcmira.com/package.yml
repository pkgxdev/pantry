distributable:
  url: https://registry.npmjs.org/arcmira/-/arcmira-{{version}}.tgz
  strip-components: 1

display-name: Arcmira

versions:
  npm: arcmira
  # These releases contain only the SDK.
  ignore: ['0.1.0', '0.1.1', '0.1.2', '0.1.3']

provides:
  - bin/arcmira

dependencies:
  nodejs.org: '>=18'

build:
  dependencies:
    npmjs.com: ^10
  script: npm install --global --prefix={{prefix}} --install-links --ignore-scripts --offline --no-audit --no-fund .

test:
  - arcmira --version | grep -F '{{version}}'
  - arcmira search --help | grep -i 'search'
