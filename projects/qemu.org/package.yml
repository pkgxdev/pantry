distributable:
  url: https://download.qemu.org/qemu-{{version}}.tar.xz
  strip-components: 1

versions:
  # uploads can often take a week or more; sooooo, we should
  # watch those
  # gitlab: qemu-project/qemu/tags
  - url: https://download.qemu.org
    match: /qemu-[0-9.]+\.tar\.xz/
    strip:
      - /^qemu-/
      - /\.tar\.xz$/

provides:
  - bin/qemu-img
  - bin/qemu-edid
  - bin/qemu-io
  - bin/qemu-nbd
  - bin/qemu-storage-daemon
  - bin/qemu-system-aarch64
  - bin/qemu-system-alpha
  - bin/qemu-system-arm
  - bin/qemu-system-avr
  - bin/qemu-system-hppa
  - bin/qemu-system-i386
  - bin/qemu-system-loongarch64
  - bin/qemu-system-m68k
  - bin/qemu-system-microblaze
  - bin/qemu-system-mips
  - bin/qemu-system-mips64
  - bin/qemu-system-mips64el
  - bin/qemu-system-mipsel
  - bin/qemu-system-or1k
  - bin/qemu-system-ppc
  - bin/qemu-system-ppc64
  - bin/qemu-system-riscv32
  - bin/qemu-system-riscv64
  - bin/qemu-system-rx
  - bin/qemu-system-s390x
  - bin/qemu-system-sh4
  - bin/qemu-system-sh4eb
  - bin/qemu-system-sparc
  - bin/qemu-system-sparc64
  - bin/qemu-system-tricore
  - bin/qemu-system-x86_64
  - bin/qemu-system-xtensa
  - bin/qemu-system-xtensaeb

dependencies:
  gnome.org/glib: 2
  capstone-engine.org: ^4
  pixman.org: ^0
  gnutls.org: ^3
  freedesktop.org/slirp: ^4
  virtualsquare.org/vde: ^2
  facebook.com/zstd: ^1
  invisible-island.net/ncurses: ^6
  libssh.org: ^0
  libpng.org: ^1

build:
  dependencies:
    gnu.org/bison: "*"
    github.com/westes/flex: "*"
    python.org: ~3.11
    ninja-build.org: "*"
    mesonbuild.com: "*"
  script:
    # TODO: linux virtfs <8 requires attr and libcap-ng
    - run: ARGS="$ARGS --enable-virtfs"
      if: ">=8"

    # https://gitlab.com/qemu-project/qemu/-/issues/1853
    - run: sed -i -e"s/-isystem', /-isystem' + /g" meson.build
      if: ">=8.1.4"

    # 11.1 uses MADV_COLD/PAGEOUT/POPULATE_READ/POPULATE_WRITE bare in
    # linux-user/mmap.c (it #ifdef-guards only MADV_COLLAPSE), assuming a
    # glibc new enough to define them. The linux builder's glibc (2.28,
    # buster) predates all four. Values are asm-generic and identical on
    # x86-64 and aarch64 (verified 20/21/22/23 on both); #ifndef keeps this a
    # no-op wherever glibc already defines them. Darwin never compiles
    # linux-user, so no gate needed beyond the version.
    - run: sed -i -e "/#include \"qemu\/osdep.h\"/r $PROP" linux-user/mmap.c
      prop: |
        #ifndef MADV_COLD
        #define MADV_COLD 20
        #endif
        #ifndef MADV_PAGEOUT
        #define MADV_PAGEOUT 21
        #endif
        #ifndef MADV_POPULATE_READ
        #define MADV_POPULATE_READ 22
        #endif
        #ifndef MADV_POPULATE_WRITE
        #define MADV_POPULATE_WRITE 23
        #endif
      if: ">=11.1"

    # Same builder-vintage problem, one layer deeper: syscall.c's fsconfig
    # block is guarded on __NR_fsopen, which qemu's BUNDLED linux-headers
    # define -- but the FSCONFIG_* values come from the HOST's <sys/mount.h>,
    # where glibc only added them in 2.36 (the builder is 2.28). They are enum
    # values on modern glibc, not macros, so the fallback is keyed on
    # FSOPEN_CLOEXEC (a macro from the same header: absent = pre-fsconfig
    # glibc) and MUST land after the sys/mount.h include -- defining them
    # before an enum that declares them would break modern builds instead.
    # Values verified 0..7 on glibc 2.41. On the 4.19 builder kernel the
    # syscall just returns ENOSYS at runtime, which is qemu's normal story
    # for too-new syscalls.
    - run: sed -i -e "/#include <sys\/mount.h>/r $PROP" linux-user/syscall.c
      prop: |
        #ifndef FSOPEN_CLOEXEC
        #define FSCONFIG_SET_FLAG 0
        #define FSCONFIG_SET_STRING 1
        #define FSCONFIG_SET_BINARY 2
        #define FSCONFIG_SET_PATH 3
        #define FSCONFIG_SET_PATH_EMPTY 4
        #define FSCONFIG_SET_FD 5
        #define FSCONFIG_CMD_CREATE 6
        #define FSCONFIG_CMD_RECONFIGURE 7
        #endif
      if: ">=11.1"

    - ./configure $ARGS
    - make --jobs {{ hw.concurrency }} install

    # Without this, `codesign` complains about resource forks in the binary
    - if: darwin
      run:
        - xattr -cr {{prefix}}/bin/*
  env:
    ARGS:
      - --prefix="{{prefix}}"
      - --disable-bsd-user
      - --disable-guest-agent
      - --enable-slirp
      - --enable-capstone
      - --enable-curses
      - --enable-libssh
      - --enable-vde
      - --enable-zstd
      - --extra-cflags=-DNCURSES_WIDECHAR=1
      - --disable-sdl
      - --disable-docs
    darwin:
      ARGS:
        - --enable-virtfs

test:
  dependencies:
    curl.se: "*"
    info-zip.org/unzip: "*"
  script:
    - qemu-system-aarch64 --version | grep "QEMU emulator version {{version}}"
    - qemu-system-alpha --version | grep "QEMU emulator version {{version}}"
    - qemu-system-arm --version | grep "QEMU emulator version {{version}}"
    - qemu-system-hppa --version | grep "QEMU emulator version {{version}}"
    - qemu-system-i386 --version | grep "QEMU emulator version {{version}}"
    - qemu-system-m68k --version | grep "QEMU emulator version {{version}}"
    - qemu-system-microblaze --version | grep "QEMU emulator version {{version}}"
    - qemu-system-mips --version | grep "QEMU emulator version {{version}}"
    - qemu-system-mips64 --version | grep "QEMU emulator version {{version}}"
    - qemu-system-mips64el --version | grep "QEMU emulator version {{version}}"
    - qemu-system-mipsel --version | grep "QEMU emulator version {{version}}"
    - qemu-system-or1k --version | grep "QEMU emulator version {{version}}"
    - qemu-system-ppc --version | grep "QEMU emulator version {{version}}"
    - qemu-system-ppc64 --version | grep "QEMU emulator version {{version}}"
    - qemu-system-riscv32 --version | grep "QEMU emulator version {{version}}"
    - qemu-system-riscv64 --version | grep "QEMU emulator version {{version}}"
    - qemu-system-rx --version | grep "QEMU emulator version {{version}}"
    - qemu-system-s390x --version | grep "QEMU emulator version {{version}}"
    - qemu-system-sh4 --version | grep "QEMU emulator version {{version}}"
    - qemu-system-sh4eb --version | grep "QEMU emulator version {{version}}"
    - qemu-system-sparc --version | grep "QEMU emulator version {{version}}"
    - qemu-system-sparc64 --version | grep "QEMU emulator version {{version}}"
    - qemu-system-tricore --version | grep "QEMU emulator version {{version}}"
    - qemu-system-x86_64 --version | grep "QEMU emulator version {{version}}"
    - qemu-system-xtensa --version | grep "QEMU emulator version {{version}}"
    - qemu-system-xtensaeb --version | grep "QEMU emulator version {{version}}"

    # FreeDOS 1.4: 1.2 is no longer served, and its layout changed. The Lite USB
    # edition rather than the Floppy edition because it is smaller (17MB against
    # 23MB) and ships both a raw image and a VMDK descriptor, so qemu-img can be
    # checked against two real formats instead of one.
    - curl -O "https://www.ibiblio.org/pub/micro/pc-stuff/freedos/files/distributions/1.4/FD14-LiteUSB.zip"
    - unzip FD14-LiteUSB.zip

    - 'qemu-img info FD14LITE.img | grep "file format: raw"'
    - 'qemu-img info FD14LITE.vmdk | grep "file format: vmdk"'

    # Real work rather than header parsing: convert between formats and check
    # the result, which exercises the block layer instead of just the prober.
    - qemu-img convert -O qcow2 FD14LITE.img converted.qcow2
    - 'qemu-img info converted.qcow2 | grep "file format: qcow2"'
    - 'qemu-img info converted.qcow2 | grep "virtual size: 32 MiB"'

    # Boot it. The old test only ever ran qemu-img, so none of the 26 emulators
    # this package provides was exercised against an image at all. QMP confirms
    # the machine reached a running state, then shuts it down, which needs no
    # timeout and no guest cooperation.
    - run: qemu-system-i386 -drive file=FD14LITE.img,format=raw -display none -qmp stdio < $FIXTURE | grep '"status":.*"running"'
      fixture: |
        {"execute":"qmp_capabilities"}
        {"execute":"query-status"}
        {"execute":"quit"}
