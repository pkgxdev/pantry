distributable:
  url: https://github.com/fclairamb/solidping/archive/refs/tags/{{ version.tag }}.tar.gz
  strip-components: 1

display-name: sp

versions:
  github: fclairamb/solidping

build:
  dependencies:
    go.dev: ^1.27
  working-directory: server
  env:
    CGO_ENABLED: 0
    LDFLAGS:
      - -s
      - -w
      - -X github.com/fclairamb/solidping/server/internal/version.Version={{version}}
    linux:
      LDFLAGS:
        - -s
        - -w
        - -X github.com/fclairamb/solidping/server/internal/version.Version={{version}}
        - -buildmode=pie
  script: go build -trimpath -ldflags="${LDFLAGS}" -o "{{prefix}}/bin/sp" ./cmd/sp

provides:
  - bin/sp

test:
  - sp --version | tee out
  - grep {{version}} out
  - run: cp $FIXTURE checks.yaml
    fixture: |
      version: 2
      organization: default
      checks:
        - slug: homepage
          name: Homepage
          type: http
          config:
            url: https://example.com
  - sp checks validate checks.yaml
