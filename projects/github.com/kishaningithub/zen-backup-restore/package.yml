distributable:
  url: https://github.com/kishaningithub/zen-backup-restore/archive/refs/tags/{{version.tag}}.tar.gz
  strip-components: 1

versions:
  github: kishaningithub/zen-backup-restore

provides:
  - bin/zen-backup-restore

build:
  dependencies:
    go.dev: ~1.27
  script:
    - go build -v -ldflags="$GO_LDFLAGS" -o "{{prefix}}"/bin/zen-backup-restore
  env:
    CGO_ENABLED: 0
    GO_LDFLAGS:
      - -s
      - -w
      - -X main.Version={{version}}

test:
  - zen-backup-restore --version 2>&1 | tee version.txt
  - grep -F "{{version}}" version.txt
  - run: cp $FIXTURE profiles.ini
    working-directory: zen
    fixture: |
      [Profile0]
      Name=Test
      IsRelative=1
      Path=Profiles/a.Test
      Default=1

      [General]
      StartWithLastProfile=1
      Version=2
  # backup refuses a profile without places.sqlite (unused)
  - run:
      - echo 'user_pref("pkgx.test", 1);' > prefs.js
      - touch places.sqlite
    working-directory: zen/Profiles/a.Test
  - zen-backup-restore list --zen-dir zen | grep Test
  - zen-backup-restore backup --zen-dir zen -p Test -o out
  - zen-backup-restore restore out/*.tar.gz --zen-dir zen --new Restored -y
  - grep -r pkgx.test zen/Profiles/*Restored*/prefs.js
