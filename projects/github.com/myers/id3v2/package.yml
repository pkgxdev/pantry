distributable:
  # brewkit clones with `git clone --branch`, which rejects a raw commit.
  # Upstream publishes no tags, so clone master and detach at the 0.1.12 commit.
  url: git+https://git.code.sf.net/p/id3v2/git
  ref: master

display-name: id3v2

versions:
  - 0.1.12

dependencies:
  id3lib.sourceforge.net: 3.8.3
  zlib.net: ^1
  # charset_conv.patch; brewkit CPATH often exposes GNU libiconv headers via gettext.
  gnu.org/libiconv: '*'
  linux:
    gnu.org/gcc/libstdcxx: ^14

provides:
  - bin/id3v2

build:
  script:
    - git fetch --depth=1 origin 770323dbde6ed466b632534de33ea9e2f71972f8
    - git checkout --detach 770323dbde6ed466b632534de33ea9e2f71972f8
    # Debian 0.1.12+dfsg-7 series (https://sources.debian.org/src/id3v2/0.1.12+dfsg-7/debian/patches/)
    - patch -p1 < props/Makefile.patch
    - patch -p1 < props/manpage.patch
    - patch -p1 < props/spelling.patch
    - patch -p1 < props/error-if-convert-fails.patch
    - patch -p1 < props/untagged_file_in_multiple_files.patch
    - patch -p1 < props/rfc822.patch
    - patch -p1 < props/charset_conv.patch
    # GNU ld --as-needed drops -lz when it appears before -lid3.
    - sed -i 's/-lz -lid3/-lid3 -lz/' Makefile
    - make PREFIX={{prefix}}
    - mkdir -p "{{prefix}}/bin" "{{prefix}}/share/man/man1"
    - cp id3v2 "{{prefix}}/bin/"
    - cp id3v2.1 "{{prefix}}/share/man/man1/"
  dependencies:
    git-scm.org: ^2
    gnu.org/patch: '*'
    linux:
      gnu.org/gcc: ^14
  env:
    LDFLAGS: $LDFLAGS -liconv

test:
  - id3v2 --version | grep {{version}}
  - printf 'dummy' > song.mp3
  - id3v2 -t 'Pantry Song' -a Pantry song.mp3
  - id3v2 -l song.mp3 | grep 'Pantry Song'
  - id3v2 -R -l song.mp3 | grep 'Filename:'
  - id3v2 -R -l song.mp3 | grep 'TIT2:'
  - id3v2 -t 'Canção' song.mp3
  - id3v2 -l song.mp3 | grep 'Canção'
