distributable:
  url: https://github.com/ip7z/7zip/archive/refs/tags/{{version.raw}}.tar.gz
  strip-components: 1

versions:
  github: ip7z/7zip/releases/tags

display-name: 7-Zip

build:
  script:
    # -Werror and Clang's -Wfatal-errors turn warnings into a failed build
    - run: |
        sed -i.bak 's/-Werror //' CPP/7zip/7zip_gcc.mak
        sed -i.bak -e 's/-Wfatal-errors//' -e 's/-Weverything//' CPP/7zip/warn_clang.mak
        rm CPP/7zip/7zip_gcc.mak.bak CPP/7zip/warn_clang.mak.bak
    - run: |
        for bundle in Bundles/Alone2 Bundles/Alone Bundles/Alone7z Bundles/Format7zF UI/Console; do
          make -C "CPP/7zip/$bundle" -f ../../cmpl_gcc.mak --jobs {{ hw.concurrency }}
        done
      if: linux
    # 7z.so needs headerpad room for fix-machos to rewrite its load commands
    - run: |
        for bundle in Bundles/Alone2 Bundles/Alone Bundles/Alone7z Bundles/Format7zF UI/Console; do
          make -C "CPP/7zip/$bundle" -f ../../cmpl_clang.mak LDFLAGS_STATIC_3=-Wl,-headerpad_max_install_names --jobs {{ hw.concurrency }}
        done
      if: darwin

    - run: |
        lib="{{prefix}}/lib/7zip"
        mkdir -p "$lib" "{{prefix}}/bin"
        install -m755 "CPP/7zip/Bundles/Alone2/$O/7zz" "{{prefix}}/bin/7zz"
        install -m755 "CPP/7zip/Bundles/Alone/$O/7za" "{{prefix}}/bin/7za"
        install -m755 "CPP/7zip/Bundles/Alone7z/$O/7zr" "{{prefix}}/bin/7zr"
        install -m755 "CPP/7zip/UI/Console/$O/7z" "$lib/7z"
        install -m755 "CPP/7zip/Bundles/Format7zF/$O/7z.so" "$lib/7z.so"
        cat > "{{prefix}}/bin/7z" << 'EOF'
        #!/bin/sh
        d="$(cd "$(dirname "$0")/.." && pwd)"
        exec "$d"/lib/7zip/7z "$@"
        EOF
        chmod 755 "{{prefix}}/bin/7z"
  env:
    O: b/g
    darwin:
      O: b/c

provides:
  - bin/7z
  - bin/7za
  - bin/7zr
  - bin/7zz

test:
  script: |
    for cmd in 7z 7zz; do
      rm -rf foo.7z out
      $cmd a -t7z foo.7z $FIXTURE
      $cmd e foo.7z -oout
      test "hello world!" = "$(cat out/*)"
    done
  fixture: hello world!
