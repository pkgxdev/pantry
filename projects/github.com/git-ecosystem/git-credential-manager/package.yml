distributable:
  url: https://github.com/git-ecosystem/git-credential-manager/archive/refs/tags/{{version.tag}}.tar.gz
  strip-components: 1

provides:
  - bin/git-credential-manager

versions:
  github: git-ecosystem/git-credential-manager/tags

dependencies:
  openssl.org: ^1.1.1
  unicode.org: ^71
  zlib.net: ^1.3
  dotnet.microsoft.com: ^10.0 # since 2.8.0

companions:
  git-scm.org: "*"

build:
  dependencies:
    git-scm.org: ^2.27.0
    kerberos.org: ^1.21.3
    linux:
      gnu.org/gcc: ">=12"
  script:
    # 3.0 moved packaging out of src/; build via upstream's publish.sh
    # (trimmed, self-contained, non-AOT) instead
    - run:
        - build/${OS}/publish.sh
          --configuration Release
          --runtime ${RUNTIME}
          --no-aot
          --output {{prefix}}/libexec
        - mkdir -p {{prefix}}/bin
        - ln -sf ../libexec/git-credential-manager {{prefix}}/bin/git-credential-manager
      if: '>=3'

    - run: >
        dotnet build ${CSPROJ}
        -p:InstallFromSource=true
        -p:installPrefix={{prefix}}
        --no-self-contained
        --configuration=${CONFIGURATION}
        --runtime=${RUNTIME}
      if: <3

    # installPrefix only seems to work for linux/x86-64
    # on darwin, it installs nothing
    # on linux/aarch64, it installs linux/x86-64 binaries
    # for some reason.
    # (`if:` takes a platform or a version range, not both, so the
    # platform check is in the shell)
    - run: |
        if [ "$(uname -s)" = Darwin ] || [ "$(uname -m)" = aarch64 ]; then
          rm -rf {{prefix}}
          mkdir -p {{prefix}}/bin
          cp -aR * {{prefix}}/bin
        fi
      if: <3
      working-directory: out/shared/Git-Credential-Manager/bin/${CONFIGURATION}/net{{deps.dotnet.microsoft.com.version.marketing}}/${RUNTIME}
  env:
    DOTNET_CLI_TELEMETRY_OPTOUT: 1
    linux:
      OS: linux
      CSPROJ: src/linux/Packaging.Linux/*.csproj
      CONFIGURATION: LinuxRelease
    linux/x86-64:
      RUNTIME: linux-x64
    linux/aarch64:
      RUNTIME: linux-arm64
    darwin:
      OS: macos
      CSPROJ: src/osx/Installer.Mac/*.csproj
      CONFIGURATION: MacRelease
    darwin/x86-64:
      RUNTIME: osx-x64
    darwin/aarch64:
      RUNTIME: osx-arm64

test: git-credential-manager --version | grep {{version}}
