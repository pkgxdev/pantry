distributable:
  url: https://github.com/iputils/iputils/archive/refs/tags/{{version.tag}}.tar.gz
  strip-components: 1

versions:
  github: iputils/iputils
  # tags are YYYYMMDD; the older s-prefixed tags predate the meson build
  transform: 'v => v.match(/^(\d{4})(\d{2})(\d{2})$/)?.slice(1).join(".")'

platforms:
  - linux

dependencies:
  kernel.org/libcap: '*'
  gnu.org/libidn2: '*'

build:
  dependencies:
    mesonbuild.com: '*'
    ninja-build.org: '*'
  script:
    - meson setup build $ARGS
    - meson compile -C build
    - meson install -C build
  env:
    # meson's vcs_tag finds the pantry checkout and stamps its hash as the version
    GIT_DIR: /dev/null
    ARGS:
      - --prefix={{prefix}}
      - --buildtype=release
      - -DBUILD_MANS=false # needs xsltproc and the docbook stylesheets
      - -DUSE_GETTEXT=false

provides:
  # keyed so darwin, where the package is unavailable, keeps inetutils as its ping
  # (libpkgx rejects a map without the host's key, hence the empty list)
  darwin: []
  linux:
    - bin/arping
    - bin/clockdiff
    - bin/ping
    - bin/tracepath

test:
  - ping -V | grep {{version.tag}}
  - tracepath -V | grep {{version.tag}}
  # UDP probes, so no raw-socket capability needed
  - tracepath -n -m 1 127.0.0.1 | grep pmtu
