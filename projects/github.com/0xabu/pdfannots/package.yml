distributable:
  url: https://github.com/0xabu/pdfannots/archive/refs/tags/v{{version.raw}}.tar.gz
  strip-components: 1

versions:
  github: 0xabu/pdfannots
  strip: /^v/

dependencies:
  pkgx.sh: ">=1"

build:
  dependencies:
    python.org: ">=3.9"
  script:
    - bkpyvenv stage {{prefix}} {{version}}
    - ${{prefix}}/venv/bin/pip install .
    - bkpyvenv seal {{prefix}} pdfannots

provides:
  - bin/pdfannots

test:
  pdfannots --version | grep "pdfannots {{version.raw}}"
