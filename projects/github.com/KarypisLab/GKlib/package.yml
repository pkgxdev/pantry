distributable:
  url: https://github.com/KarypisLab/GKlib/archive/refs/tags/{{version.tag}}.tar.gz
  strip-components: 1

versions:
  github: KarypisLab/GKlib/tags
  strip:
    - /^METIS-/
    - /-DistDGL-0\.5$/

build:
  dependencies:
    gnu.org/make: '*'
    cmake.org: '*'
  script:
    - make config $ARGS
    - make -j {{hw.concurrency}}
    - make install
    # v0.0.1 builds these apps but its install rules only install csrcnv
    - run: cp build/*/apps/{cmpnbrs,fis,gkgraph,gkrw,m2mnbrs} {{prefix}}/bin/
      if: <1
  env:
    # cmake 4 rejects cmake_minimum_required < 3.5, which GKlib 5.1.1 still declares
    CMAKE_POLICY_VERSION_MINIMUM: "3.5"
    ARGS:
      - prefix="{{prefix}}"

provides:
  - bin/cmpnbrs
  - bin/csrcnv
  - bin/fis
  - bin/gkgraph
  - bin/gkrw
  - bin/m2mnbrs

# help? i have no idea what to do with these.
test: cmpnbrs -help
