distributable:
  url: https://github.com/neovim/unibilium/archive/v{{version}}.tar.gz
  strip-components: 1

versions:
  github: neovim/unibilium

build:
  dependencies:
    cmake.org: ^3
    gnu.org/libtool: '*'
  darwin:
    invisible-island.net/ncurses: '*'
  script:
    - run:
        - make --jobs {{ hw.concurrency }}
        - make --jobs {{ hw.concurrency }} install PREFIX={{prefix}}
      if: <2.1.2
    - run:
        - cmake -B build $CMAKE_ARGS
        - cmake --build build
        - cmake --install build
      if: '>=2.1.2'
  env:
    CMAKE_ARGS:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_PREFIX={{prefix}}
      - -DBUILD_SHARED_LIBS=ON
      # 2.1.4 added doc/CMakeLists.txt, which hard-errors out of *configure*
      # without pod2man and gzip; our linux builders have neither, which is why
      # darwin shipped 2.1.4 off its system perl and linux never did. upstream's
      # message points at CMAKE_SKIP_INSTALL_RULES, but that is stock cmake's
      # global switch and would take the library and the .pc file out along with
      # the man pages. this option is theirs and is scoped to doc/; <2.1.4
      # shipped no doc/ at all, so there it is merely unused.
      - -DBUILD_MAN_PAGES=OFF

test:
  dependencies:
    freedesktop.org/pkg-config: '*'
  script:
    - run: pkg-config --modversion unibilium | grep {{version}}
      if: <2.1.2
    - cc test.c -lunibilium -o test
    - ./test
