distributable:
  url: https://github.com/tmux/tmux/releases/download/{{version.raw}}/tmux-{{version.raw}}.tar.gz
  strip-components: 1

versions:
  github: tmux/tmux/tags

dependencies:
  libevent.org: ^2.0
  invisible-island.net/ncurses: '*'
  darwin:
    jemalloc.net: '*'

build:
  dependencies:
    gnu.org/bison: '*'
  script:
    - ./configure $ARGS
    - make
    - make install
  env:
    ARGS:
      - --prefix={{prefix}}
      - --disable-utf8proc
    darwin:
      ARGS:
        - --enable-jemalloc

test: tmux -V

provides:
  - bin/tmux
