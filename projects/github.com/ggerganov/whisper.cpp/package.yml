distributable:
  url: https://github.com/ggml-org/whisper.cpp/archive/refs/tags/{{version.tag}}.tar.gz
  strip-components: 1

versions:
  github: ggml-org/whisper.cpp

platforms:
  - darwin/aarch64
  - linux

provides:
  - bin/whisper.cpp
  - bin/whisper-cli

dependencies:
  libsdl.org: "*"
  linux:
    openmp.llvm.org: 18 # as of 1.7.0
    gnu.org/gcc/libstdcxx: 14

companions:
  huggingface.co: "*"

build:
  dependencies:
    gnu.org/patch: "*"
    gnu.org/coreutils: "*"
    cmake.org: 3 # as of 1.7.3
  script:
    - run: patch -p1 < props/illegal_instruction.patch
      if: <1.4.3

    - run:
        - make --jobs {{ hw.concurrency }}
        - make stream --jobs {{ hw.concurrency }}
        - make command --jobs {{ hw.concurrency }}
        - install -Dt {{prefix}}/bin
          stream command
        - install -D main {{prefix}}/bin/whisper.cpp
      if: "<1.7.3"

    # ggml-metal.metal must be installed alongside whisper.cpp sadly
    - run: cp ggml-metal.metal {{prefix}}/bin
      if: <1.7
    - run: cp ggml/src/ggml-metal.metal {{prefix}}/bin
      if: ">=1.7<1.7.3"

    # deprecation warning blocks valid bin names for some reason
    - run: sed -i 's/add_subdirectory(deprecation-warning)/#add_subdirectory(deprecation-warning)/' CMakeLists.txt
      working-directory: examples
      if: ">=1.7.4"

    - run:
        - cmake -B . -S .. $CMAKE_ARGS
        - cmake --build . --parallel {{ hw.concurrency }} --config Release
        - cmake --install . --prefix {{prefix}}
      working-directory: build
      if: ">=1.7.3"

    - run: install -D main {{prefix}}/bin/whisper-cli
      working-directory: build/bin
      if: "=1.7.3"

    - run: install -D whisper-cli {{prefix}}/bin/whisper-cli
      working-directory: build/bin
      if: ">=1.7.4"

    - run: ln -s whisper-cli whisper.cpp
      working-directory: ${{prefix}}/bin

    - install -D models/download-ggml-model.sh {{prefix}}/bin/download-ggml-model.sh
    - install -D examples/command/commands.txt {{prefix}}/share/whisper.cpp/commands.txt
  env:
    linux:
      CMAKE_ARGS:
        # -lstdc++fs is load-bearing on linux/x86-64: without it ld.lld fails
        # with undefined std::filesystem references from libggml.so. It is NOT
        # needed on linux/aarch64, where those symbols resolve from
        # libstdc++.so.6 directly. Removing it globally breaks the x64 build.
        - -DCMAKE_EXE_LINKER_FLAGS=-Wl,-lstdc++fs,-lpthread

        # Clang autodetects a GCC installation for its libstdc++ headers, and
        # on the buster runner that is /usr/include/c++/8 (libstdc++-8-dev is
        # installed in the runner image). ggml therefore compiled <filesystem>
        # against GCC 8 while linking libstdcxx 14 -- and path::_Cmpt has a
        # different layout in each, so 1.9.2 segfaulted in
        # _Destroy<path::_Cmpt> inside ggml_backend_load_all. Point clang at
        # the libstdcxx we actually link against. Trixie-based images never
        # showed this because their system headers are already GCC 14.
        - -DCMAKE_CXX_FLAGS=--gcc-toolchain={{ deps.gnu.org/gcc/libstdcxx.prefix }}
        - -DCMAKE_C_FLAGS=--gcc-toolchain={{ deps.gnu.org/gcc/libstdcxx.prefix }}

test:
  env:
    cache: $HOME/.cache/huggingface
  script:
    - hf download ggerganov/whisper.cpp ggml-base.en.bin
    - model="$(find "$cache" -name "ggml-base.en.bin")"
    - curl -fLO https://github.com/ggml-org/whisper.cpp/raw/refs/heads/master/samples/jfk.wav
    - whisper-cli --model "$model" jfk.wav | tee out
    - grep -i "ask not what your country can do for you" out
