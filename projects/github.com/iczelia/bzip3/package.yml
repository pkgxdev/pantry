distributable:
  # Release tarballs are autotools `make dist` archives (they ship ./configure).
  # Tags before 1.2.2 do not install the full wrapper set (bz3most, etc.).
  url: https://github.com/iczelia/bzip3/releases/download/{{version}}/bzip3-{{version}}.tar.gz
  strip-components: 1

versions:
  github: iczelia/bzip3/releases/tags
  ignore: ['<1.2.2']

provides:
  - bin/bunzip3
  - bin/bz3cat
  - bin/bz3grep
  - bin/bz3less
  - bin/bz3more
  - bin/bz3most
  - bin/bzip3

build:
  # libtool records the +brewing prefix as an absolute RPATH. brewkit then
  # relativizes that path against the relocated install dir, so bzip3 looks
  # for libbzip3 in a directory that no longer exists. Point it at the
  # sibling lib dir and leave that $ORIGIN entry alone.
  skip: fix-patchelf
  dependencies:
    freedesktop.org/pkg-config: ^0.29
    linux:
      nixos.org/patchelf: '*'
  script:
    - ./configure $ARGS
    - make --jobs {{ hw.concurrency }} install
    - run: patchelf --set-rpath '$ORIGIN/../lib' bzip3
      if: linux
      working-directory: '{{prefix}}/bin'
  env:
    ARGS:
      - --prefix={{prefix}}
      - --disable-dependency-tracking
      - --disable-arch-native

test:
  env:
    INPUT: tea.xyz.test-string
  script:
    - bzip3 -V | grep {{version}}
    - test "$(printf '%s' "$INPUT" | bzip3 | bzip3 -d)" = "$INPUT"
    - test "$(printf '%s' "$INPUT" | bzip3 | bz3cat)" = "$INPUT"
