distributable:
  url: https://github.com/lrstanley/vault-unseal/archive/refs/tags/{{version.tag}}.tar.gz
  strip-components: 1

display-name: vault-unseal

versions:
  github: lrstanley/vault-unseal

build:
  dependencies:
    go.dev: "*"
  env:
    CGO_ENABLED: 0
    GO_LDFLAGS:
      - -s
      - -w
      - -X main.version="{{ version }}"
      - -X main.commit="$( git rev-parse HEAD )"
      - -X main.date="$( date --iso-8601=minutes )"
    linux:
      GO_LDFLAGS:
        - -buildmode=pie
  script:
    - go build -v -ldflags="${GO_LDFLAGS}" -o "{{ prefix }}"/bin/vault-unseal

provides:
  - bin/vault-unseal

# clix v2.0.1 (pulled in by 1.0.1) reflowed the --version banner: the version
# moved off line 1 onto line 3, behind the description and a blank line, so the
# old `head -n1 | cut -f3` extracted "Hashicorp". Match the value itself rather
# than a line/field position.
test:
  - vault-unseal --version | tee out
  - 'grep -F "version: {{version}}" out'
