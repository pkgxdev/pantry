distributable:
  url: https://github.com/xo/usql/archive/refs/tags/{{version.tag}}.tar.gz
  strip-components: 1

versions:
  github: xo/usql

provides:
  - bin/usql

build:
  dependencies:
    go.dev: ~1.26.1
    crates.io/sd: "*"
  script:
    - sd 0.0.0-dev v{{version}} text/text.go
    - go mod download
    - mkdir -p "{{ prefix }}"/bin
    - go build -v -trimpath -ldflags="$GO_LDFLAGS" -o {{prefix}}/bin/usql .
  env:
    GO111MODULE: on
    CGO_ENABLED: 1
    GO_LDFLAGS:
      - -s
      - -w
    linux:
      # or segmentation fault
      # fix found here https://github.com/docker-library/golang/issues/402#issuecomment-982204575
      GO_LDFLAGS:
        - -buildmode=pie

test: test "$(usql --version)" = "usql v{{version}}"
