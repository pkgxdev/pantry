distributable:
  url: https://github.com/Salamek/picpro/archive/refs/tags/{{version.tag}}.tar.gz
  strip-components: 1

versions:
  github: Salamek/picpro

dependencies:
  python.org: '>=3.12'

build: python-venv.sh {{prefix}}/bin/picpro

provides:
  - bin/picpro

test: picpro chip_info 12F675 | grep '"chip_name"'
