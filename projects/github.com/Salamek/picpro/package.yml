distributable:
  url: https://github.com/Salamek/picpro/archive/refs/tags/{{version}}.tar.gz
  strip-components: 1

# Tags prior to 0.4.1 use a different layout and require Python >=3.6.
versions:
  github: Salamek/picpro/tags
  ignore: ['<0.4.1']

dependencies:
  python.org: '>=3.12'

build: python-venv.sh {{prefix}}/bin/picpro

provides:
  - bin/picpro

test:
  script:
    - picpro chip_info 12F675 | grep '"chip_name"'
