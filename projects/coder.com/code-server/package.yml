distributable:
  url: https://registry.npmjs.org/code-server/-/code-server-{{version}}.tgz
  strip-components: 1

versions:
  npm: code-server

dependencies:
  # nodejs.org: 20 # requires ^20, before .6 there were napi issues, and .14 also manifests
  # nodejs.org: 22 # since 4.101.0
  nodejs.org: 24 # since 4.133.0
  linux:
    gnome.org/libsecret: ^0.21
    x.org/x11: ^1.8
    x.org/xkbfile: ^1.1
    kerberos.org: ^1.21

build:
  dependencies:
    npmjs.com: 10 # still needs unsafe-perm
    python.org: ">=3.11"
  script:
    - npm i $ARGS .
    - npm i $ARGS $PKGS
    - run: cp -a $SRCROOT/* .
      working-directory: "{{prefix}}/libexec"
    - run: ln -s ../libexec/out/node/entry.js code-server
      working-directory: "{{prefix}}/bin"
  skip: fix-machos
  env:
    ARGS:
      - --ddd
      - --legacy-peer-deps
      - --unsafe-perm
      - --omit=dev
    PKGS:
      - "@microsoft/1ds-core-js"
      - minimist
      - "@vscode/spdlog"
      - yauzl
    CXXFLAGS:
      - -DNODE_API_EXPERIMENTAL_NOGC_ENV_OPT_OUT
    linux:
      CC: clang
      CXX: clang++
      LD: clang
      CXXFLAGS:
        - -D__NO_INLINE__

provides:
  - bin/code-server

test:
  dependencies:
    curl.se: "*"
    pkgx.sh: 1
  script:
    - code-server --version | grep {{version}}
    # this is broken after their massive changes in 4.95
    - run:
        - code-server --extensions-dir=. --install-extension ms-python.python -vvv
        - code-server --extensions-dir=. --list-extensions | grep ms-python.python
      if: <4.95
    - code-server &
    - PID=$!
    - sleep 5
    - curl http://localhost:$PORT/login
    - kill $PID
  env:
    PORT: $(npx --yes get-port-cli | tail -n1)
