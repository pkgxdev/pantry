distributable:
  url: https://github.com/spider-rs/spider/archive/refs/tags/{{ version.tag }}.tar.gz
  strip-components: 1

provides:
  - bin/spider

versions:
  github: spider-rs/spider

build:
  dependencies:
    rust-lang.org: ">=1.56"
    rust-lang.org/cargo: "*"
    github.com/mikefarah/yq: ">=4" # safe-edit toml deps/features
  env:
    linux/x86-64:
      # -pie: ubuntu requires PIE (passes on debian without it, SIGILL on ubuntu)
      # target-cpu: prevent AVX etc. that CI runners may not support
      RUSTFLAGS: -C target-cpu=x86-64 -C link-args=-pie
  script:
    # needs openssl 3 on linux, but our rust locks us to 1.1.1
    - run: yq -i '.dependencies.openssl-sys.version = "*" | .dependencies.openssl-sys.features = ["vendored"]' Cargo.toml
      working-directory: spider_cli
      if: linux
    # io_uring is default-on but SIGILLs on CI ubuntu runners (since v2.47.22)
    - run: yq -i '.features.default -= ["io_uring"]' Cargo.toml
      working-directory: spider
      if: linux/x86-64
    # 2.54.2 x86-64 builds SIGILL on the ubuntu CI runner inside aws-lc's rustls
    # provider (an Arc refcount abort). Use ring instead: reqwest without a provider,
    # ring installed in main(), and crates.io spider 2.53.9 (pulled in by
    # spider_transformations) patched to the same feature set.
    - run: curl -fsSL https://static.crates.io/crates/spider/spider-2.53.9.crate | tar xz && mv spider-2.53.9 spider2539
      if: linux/x86-64
    - run: |
        perl -0pi -e 's/= \["reqwest\/rustls"\]/= ["reqwest\/rustls-no-provider", "dep:rustls"]/g; s/(reqwest = \{ version = "0\.13", )features = \[/$1default-features = false, features = [\n    "rustls-no-provider",/' spider/Cargo.toml
        printf '\n[dependencies.rustls]\nversion = "0.23"\noptional = true\ndefault-features = false\nfeatures = ["ring", "std", "tls12", "logging"]\n' >> spider/Cargo.toml
        perl -0pi -e 's/= \["reqwest\/rustls"\]/= ["reqwest\/rustls-no-provider", "dep:rustls"]/g; s/(\[target\.\x27cfg\(not\(target_arch = "wasm32"\)\)\x27\.dependencies\.reqwest\]\nversion = "0\.13"\n)/$1default-features = false\n/; s/(\[target\.\x27cfg\(not\(target_arch = "wasm32"\)\)\x27\.dependencies\.reqwest\]\n.*?features = \[\n)/$1    "rustls-no-provider",\n/s' spider2539/Cargo.toml
        printf '\n[dependencies.rustls]\nversion = "0.23"\noptional = true\ndefault-features = false\nfeatures = ["ring", "std", "tls12", "logging"]\n' >> spider2539/Cargo.toml
        perl -0pi -e 's/reqwest = \{ version = "0\.13", features = \["json"\] \}/reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }\nrustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }/' spider_cli/Cargo.toml
        perl -0pi -e 's/(async fn main\(\) \{\n)/$1    let _ = rustls::crypto::ring::default_provider().install_default();\n/' spider_cli/src/main.rs
        printf '\n[patch.crates-io]\nspider = { path = "spider2539" }\n' >> Cargo.toml
        grep -q 'install_default' spider_cli/src/main.rs && grep -q 'spider2539' Cargo.toml && grep -q 'rustls-no-provider' spider/Cargo.toml
      if: linux/x86-64
    # newer rustls-webpki depends on aws-lc-rs even with ring; keep the last versions without it
    - run: |
        cargo update -p rustls --precise 0.23.40
        cargo update -p rustls-webpki --precise 0.103.13
      if: linux/x86-64
    # _requires_ spider/serde to build since 2.37.120
    - cargo install --path spider_cli --root {{prefix}} --features smart,spider/serde
  skip: fix-patchelf # dumps on x86-64

test:
  dependencies:
    linux/x86-64:
      gnu.org/binutils: "*"
      darwinsys.com/file: "*"
      strace.io: "*"
  script:
    - run:
        - BIN=$(command -v spider)
        - echo "=== file ==="
        - file $BIN
        - echo "=== readelf -h (ELF type) ==="
        - readelf -h $BIN | grep -i type
        - echo "=== readelf -d (RPATH/RUNPATH) ==="
        - readelf -d $BIN | grep -iE 'rpath|runpath|needed' || echo "(none)"
        - echo "=== ldd ==="
        - ldd $BIN
        - echo "=== AVX instruction count ==="
        - objdump -d $BIN | grep -c -iE 'vmov|vpadd|vpxor|vbroadcast|vzero' || echo "0"
        - echo "=== CPU flags ==="
        - grep -oP 'flags\s*:\s*\K.*' /proc/cpuinfo | head -1
        - echo "=== SIGILL crash analysis ==="
        - RUST_BACKTRACE=full strace -f -o /tmp/spider.strace spider -v --url https://choosealicense.com crawl 2>&1 || true
        - FAULT=$(grep 'si_addr=' /tmp/spider.strace | grep -oP 'si_addr=\K0x[0-9a-f]+' || true)
        - echo "fault addr=$FAULT"
        - echo "=== /proc/pid maps (text segment base) ==="
        - grep ' r.xp ' /tmp/spider.strace | head -5 || true
        - echo "=== last 20 lines before crash ==="
        - grep -B20 'SIGILL' /tmp/spider.strace | head -25 || true
        - echo "=== finding faulting function ==="
        - |
          if test -n "$FAULT"; then
            # offset is consistently 0x7b2ca7 across all ASLR'd runs
            OFFSET=0x7b2ca7
            echo "known offset=$OFFSET"
            echo "=== addr2line ==="
            addr2line -e $BIN -f -p $OFFSET 2>&1 || true
            echo "=== objdump (is it ud2?) ==="
            objdump -d --start-address=0x7b2c90 --stop-address=0x7b2cb0 $BIN || true
            echo "=== nm nearest ==="
            nm -n $BIN | awk -v o=0x7b2ca7 'BEGIN{t=strtonum(o)} /^[0-9a-f]+ [tT]/{if(strtonum("0x"$1)>t){print prev; exit}; prev=$0}' || true
          fi
      if: linux/x86-64
    - spider -v --url https://choosealicense.com crawl
