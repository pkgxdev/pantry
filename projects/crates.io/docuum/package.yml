distributable:
  url: https://github.com/stepchowfun/docuum/archive/refs/tags/{{ version.tag }}.tar.gz
  strip-components: 1

provides:
  - bin/docuum

versions:
  github: stepchowfun/docuum

build:
  dependencies:
    rust-lang.org: ">=1.65"
    rust-lang.org/cargo: "*"
  script: cargo install --locked --path . --root {{prefix}}

test:
  - docuum --version | grep -ix "docuum {{version}}"
