distributable:
  url: https://github.com/argoproj/argo-cd/archive/v{{version}}.tar.gz
  strip-components: 1

display-name: argo-cd

versions:
  github: argoproj/argo-cd

build:
  dependencies:
    go.dev: "*"
    nodejs.org: "<23"
    classic.yarnpkg.com: "*"
    pnpm.io: "*" # as of 3.5.0
    linux:
      git-scm.org: "*"
  script:
    - run: NODE_ENV=development make --jobs {{hw.concurrency}} dep-ui-local
    - run:
        - yarn build
      if: <3.5
      working-directory: ui
    - run:
        - pnpm build
      if: ">=3.5"
      working-directory: ui
    - make --jobs {{hw.concurrency}} cli-local
    - mkdir -p {{prefix}}/bin
    - install dist/argocd {{prefix}}/bin/
  env:
    NODE_ENV: production
    NODE_ONLINE_ENV: online
    LDFLAGS:

provides:
  - bin/argocd

test:
  - argocd --help
  - touch argocd-config
  - chmod 0600 argocd-config
  - argocd context --config ./argocd-config | grep "CURRENT  NAME  SERVER"
