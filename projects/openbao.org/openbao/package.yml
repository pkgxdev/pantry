distributable:
  url: git+https://github.com/openbao/openbao
  ref: ${{version.tag}}

display-name: openbao

versions:
  github: openbao/openbao

build:
  dependencies:
    go.dev: '*'
    gnu.org/coreutils: '*'
    git-scm.org: '*'

  env:
    CGO_ENABLED: 0
    GO_LDFLAGS:
    - -s
    - -w
    - -X github.com/openbao/openbao/version.fullVersion={{version}}
    - -X github.com/openbao/openbao/version.GitCommit=$( git rev-parse HEAD )
    - -X github.com/openbao/openbao/version.BuildDate=$( date --iso-8601=seconds )
    # >=2.7: module is v2 and the package moved to internal/
    - -X github.com/openbao/openbao/v2/internal/version.fullVersion={{version}}
    - -X github.com/openbao/openbao/v2/internal/version.GitCommit=$( git rev-parse HEAD )
    - -X github.com/openbao/openbao/v2/internal/version.BuildDate=$( date --iso-8601=seconds )
    linux:
      GO_LDFLAGS:
      - -buildmode=pie
  script:
    - go build -v -ldflags="${GO_LDFLAGS}" -o "{{ prefix }}"/bin/bao
    - run:
      - install -D setup.bash {{prefix}}/bin/bao-setup
      - install -D README.md {{prefix}}/doc/README.md
      - install -D openbao.hcl {{prefix}}/etc/openbao/openbao.hcl
      - install -D openbao.env {{prefix}}/etc/openbao/openbao.env
      - install -D openbao.service {{prefix}}/etc/systemd/system/openbao.service
      working-directory: props

provides:
  - bin/bao
  - bin/bao-setup

test: test "$(bao version|cut -d' ' -f2)" = {{version.tag}}
