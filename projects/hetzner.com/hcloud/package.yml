distributable:
  url: https://github.com/hetznercloud/cli/archive/refs/tags/{{version.tag}}.tar.gz
  strip-components: 1

versions:
  github: hetznercloud/cli/tags

provides:
  - bin/hcloud

build:
  script: go build -o "{{ prefix }}"/bin/hcloud -v -ldflags="$GO_LDFLAGS" cmd/hcloud/main.go
  dependencies:
    go.dev: ~1.26.8
  env:
    GO111MODULE: on
    CGO_ENABLED: 0
    GO_LDFLAGS:
      - -s
      - -w
      - '-X=github.com/hetznercloud/cli/internal/version.Version={{version}}'
    linux:
      # or segmentation fault
      # fix found here https://github.com/docker-library/golang/issues/402#issuecomment-982204575
      GO_LDFLAGS:
        - -buildmode=pie

test:
  - hcloud version
  - hcloud version | grep "hcloud {{version}}"
