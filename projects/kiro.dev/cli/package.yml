# because of the license we cannot redistribute the binary, so we provide a
# shim that will download the binary on first execution and then execute it
#
# license: https://aws.amazon.com/pt/legal/aws-ip-license-terms/

versions:
  url: https://desktop-release.q.us-east-1.amazonaws.com/latest/manifest.json
  match: /"version":\s*"\d+\.\d+\.\d+"/
  strip:
    - /^"version":\s*"/
    - /"$/

dependencies:
  curl.se: "*"
  linux:
    alsa-project.org/alsa-lib: "*" # v2.6.0 requires libasound.so.2

# v3 dropped the .app/dmg and the -chat/-term helpers: one kiro-cli binary,
# shipped as a tarball on every platform
build:
  - sed -i "s/%%version%%/{{version}}/g" props/shim
  - install -Dm755 props/shim {{prefix}}/bin/kiro-cli

provides:
  - bin/kiro-cli

test:
  dependencies:
    gnu.org/coreutils: "*"
  script:
    # first time will download and execute the actual binary
    - rm -rf {{prefix}}/libexec
    - test ! -f {{prefix}}/libexec/bin/kiro-cli
    - kiro-cli --version | grep -w "{{version}}"
    # second time will just execute the actual binary
    - test -f {{prefix}}/libexec/bin/kiro-cli
    - timeout 0.5 kiro-cli --version | grep -w "{{version}}"
    - kiro-cli chat --help | grep -F 'kiro-cli chat [OPTIONS]'
