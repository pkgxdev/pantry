distributable:
  url: https://github.com/MediaArea/MediaInfoLib/archive/refs/tags/{{version.tag}}.tar.gz
  strip-components: 1

versions:
  github: MediaArea/MediaInfoLib/tags
  strip: /^tag\/v/

dependencies:
  mediaarea.net/libzen: ^0.4
  zlib.net: ^1
  curl.se: '*'

build:
  dependencies:
    cmake.org: ^3
  script:
    - cmake -S Project/CMake -B build $ARGS
    - cmake --build build
    - cmake --install build
  env:
    ARGS:
      - -DCMAKE_INSTALL_PREFIX={{prefix}}
      - -DCMAKE_INSTALL_LIBDIR=lib
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_VERBOSE_MAKEFILE=ON
      - -Wno-dev
      - -DBUILD_SHARED_LIBS=ON
      - -DBUILD_ZLIB=OFF
      - -DBUILD_ZENLIB=OFF

test:
  dependencies:
    freedesktop.org/pkg-config: '*'
  script: pkg-config --modversion libmediainfo | grep {{version.raw}}
