distributable:
   url: https://github.com/Azure/azure-cli/archive/refs/tags/azure-cli-{{version}}.tar.gz
   strip-components: 1

# if there’s a github then we can parse the versions
versions:
  github: Azure/azure-cli/tags  # reads github tags from github
  strip: /^azure-cli-/

dependencies:
  openssl.org: 1.1
  python.org: '>=3.10<3.12'
  sourceware.org/libffi: '*'

build:
  dependencies:
    pkgx.sh: '>=1'
    rust-lang.org: '*'
    linux:
      freedesktop.org/pkg-config: '*'
  env:
    CC: clang
    LD: clang
    # cryptography refuses to build against OpenSSL < 3; the runtime dep stays at 1.1
    OPENSSL_STATIC: 1
    OPENSSL_DIR: "{{pkgx.prefix}}/openssl.org/v3"
  script: |
    pkgx +openssl.org^3
    _SRCROOT="$SRCROOT"
    for venv in azure-cli{-telemetry,-core,}; do
      SRCROOT="$_SRCROOT"/src/"$venv" python-venv.sh "{{prefix}}"/bin/az
    done


provides:
  - bin/az

test:
  script: |
    az cloud show --name AzureCloud
