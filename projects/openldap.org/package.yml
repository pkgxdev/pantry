distributable:
  url: https://www.openldap.org/software/download/OpenLDAP/openldap-release/openldap-{{version}}.tgz
  strip-components: 1

versions:
  url: https://www.openldap.org/software/download/OpenLDAP/openldap-release/
  match: /openldap-\d+\.\d+\.\d+.tgz/
  strip:
    - /^openldap-/
    - /\.tgz/

dependencies:
  openssl.org: ^1.1
  linux:
    github.com/util-linux/util-linux: '*'

build:
  script:
    - ./configure $ARGS

    # Avoid needing groff to build the docs
    - sed -i -e 's/SUBDIRS=\(.*\)\bdoc\b\(.*\)/SUBDIRS=\1\2/' Makefile

    - make --jobs {{ hw.concurrency }} install
  env:
    ARGS:
      - --prefix="{{prefix}}"
      - --enable-accesslog
      - --enable-auditlog
      - --enable-constraint
      - --enable-dds
      - --enable-deref
      - --enable-dyngroup
      - --enable-dynlist
      - --enable-memberof
      - --enable-ppolicy
      - --enable-proxycache
      - --enable-refint
      - --enable-retcode
      - --enable-seqmod
      - --enable-translucent
      - --enable-unique
      - --enable-valsort
      - --without-systemd
    linux:
      # undefined symbol errors in newer llvms prevent building shared libs
      CFLAGS: $CFLAGS -Wl,--undefined-version
      # 2.7.0's mdb backend calls dlopen/dlsym/dlclose/dlerror from
      # mdbmodule.c, but configure does not add -ldl to slapd's link. glibc
      # merged libdl into libc in 2.34; the buster builder is 2.28, where the
      # only linkable copy is still in libdl.so.2. Harmless on newer glibc,
      # where libdl is an empty compat stub.
      LDFLAGS: $LDFLAGS -ldl

provides:
  - bin/ldapcompare
  - bin/ldapdelete
  - bin/ldapexop
  - bin/ldapmodify
  - bin/ldapmodrdn
  - bin/ldappasswd
  - bin/ldapsearch
  - bin/ldapurl
  - bin/ldapvc
  - bin/ldapwhoami

test:
  - ldapcompare -VV 2>&1 | tee out
  - grep {{version}} out
