name: pkgx/pantry/complain
description: creates an issue for failure conditions

inputs:
  pkg:
    description: project to complain about
    required: true
  platform:
    description: platform that failed, noted in the log comment
    required: false
  token:
    description: github token
    required: true
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    # prevent issue storms by randomizing the delay before we check/create
    # otherwise, if multiple builds fail at once, they will all try to create issues
    - name: Variable Sleep
      shell: bash
      run: sleep $(( RANDOM % 120 ))

    - name: Find, Reopen or Create Issue
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        PKG: ${{ inputs.pkg }}
        PLATFORM: ${{ inputs.platform }}
      run: ${{ github.action_path }}/complain.sh
